<body>

  <div id="root"></div>

  <script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useCallback, useEffect } = React;

// ─── Aesthetic constants ─────────────────────────────────────────
const ACCENT = "#facc15";
const FG = "#e5e7eb";
const FG_DIM = "#9ca3af";
const FG_MUTE = "#6b7280";
const BG = "#0a0e14";
const PANEL = "#111720";
const PANEL_2 = "#1a212c";
const STROKE = "#252d3a";
const RIDER_COLORS = ["#22d3ee", "#facc15", "#f472b6", "#a78bfa", "#fb923c", "#34d399", "#f87171", "#60a5fa"];

// ─── Inline SVG icon factory (replaces lucide-react) ─────────────
const makeIcon = (children) => ({ size = 14, className = "", style = {} }) => (
  <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none"
       stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
       className={className} style={{ display: "inline-block", verticalAlign: "middle", ...style }}>
    {children}
  </svg>
);
const Upload = makeIcon(<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></>);
const X = makeIcon(<><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>);
const Plus = makeIcon(<><path d="M5 12h14"/><path d="M12 5v14"/></>);
const Trash2 = makeIcon(<><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></>);
const AlertCircle = makeIcon(<><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></>);
const Activity = makeIcon(<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>);
const MapPin = makeIcon(<><path d="M20 10c0 7-8 13-8 13s-8-6-8-13a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></>);
const Users = makeIcon(<><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>);
const Layers = makeIcon(<><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></>);
const Gauge = makeIcon(<><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></>);
const UserCog = makeIcon(<><circle cx="18" cy="15" r="3"/><circle cx="9" cy="7" r="4"/><path d="M10 15H6a4 4 0 0 0-4 4v2"/><path d="m21.7 16.4-.9-.3"/><path d="m15.2 13.9-.9-.3"/><path d="m16.6 18.7.3-.9"/><path d="m19.1 12.2.3-.9"/><path d="m19.6 18.7-.4-1"/><path d="m16.8 12.3-.4-1"/><path d="m14.3 16.6 1-.4"/><path d="m20.7 13.8 1-.4"/></>);
const ChevronDown = makeIcon(<path d="m6 9 6 6 6-6"/>);
const Play = makeIcon(<polygon points="6 3 20 12 6 21 6 3"/>);
const Pause = makeIcon(<><rect x="14" y="4" width="4" height="16" rx="0.5"/><rect x="6" y="4" width="4" height="16" rx="0.5"/></>);
const RotateCcw = makeIcon(<><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></>);
const Menu = makeIcon(<><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></>);

// ─── Helpers ─────────────────────────────────────────────────────
const fmtTime = (s) => {
  if (s == null || isNaN(s)) return "—";
  const m = Math.floor(s / 60);
  const sec = (s - m * 60).toFixed(3);
  return m > 0 ? `${m}:${sec.padStart(6, "0")}` : `${parseFloat(sec).toFixed(3)}`;
};
const fmtNum = (n, d = 1) => (n == null || isNaN(n) ? "—" : n.toFixed(d));

const llToMeters = (lat, lon, lat0, lon0) => {
  const mLat = 111000;
  const mLon = 111000 * Math.cos((lat0 * Math.PI) / 180);
  return [(lon - lon0) * mLon, (lat - lat0) * mLat];
};

const newId = () => `id_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;

// ─── RPM color: fixed scale, engine-type aware ───────────────────
// 2st: ≤5,000=blue, 8,000=yellow, 14,000=red
// 4st: ≤3,000=blue, 8,000=yellow, 12,000=red
const RPM_STOPS = {
  "2st": { low: 5000, mid: 8000, high: 14000 },
  "4st": { low: 3000, mid: 8000, high: 12000 },
};
// HSL interpolation gives vivid mids (blue → cyan → green → yellow → orange → red)
const rpmColor = (rpm, engineType = "4st") => {
  const { low, mid, high } = RPM_STOPS[engineType] || RPM_STOPS["4st"];
  let h, s, l;
  if (rpm <= low)        { h = 220; s = 85; l = 50; }
  else if (rpm >= high)  { h = 0;   s = 90; l = 50; }
  else if (rpm < mid) {
    const t = (rpm - low) / (mid - low);
    h = 220 + (50 - 220) * t;
    s = 85 + (95 - 85) * t;
    l = 50 + (55 - 50) * t;
  } else {
    const t = (rpm - mid) / (high - mid);
    h = 50 + (0 - 50) * t;
    s = 95 + (90 - 95) * t;
    l = 55 + (50 - 55) * t;
  }
  return `hsl(${h.toFixed(0)},${s.toFixed(0)}%,${l.toFixed(0)}%)`;
};

// ─── AFR color: full 8.0–20.0 range, engine-type aware target band ─
// Multi-stop gradient: deep blue (rich) → cyan → green (target) → yellow → red (lean)
const AFR_TARGETS = {
  "2st": { low: 11.5, mid: 12.0, high: 12.5 },
  "4st": { low: 12.5, mid: 13.0, high: 13.5 },
};
const AFR_MIN = 8.0;
const AFR_MAX = 20.0;
// HSL interpolation between stops; gradient "warmer = leaner = more dangerous"
const afrColor = (afr, engineType = "4st") => {
  const t = AFR_TARGETS[engineType] || AFR_TARGETS["4st"];
  // Build stop array: [afrValue, h, s, l]
  const stops = [
    [AFR_MIN, 240, 80, 30],   // very rich: deep blue
    [11.0,    210, 85, 50],   // rich: blue
    [t.low,   170, 80, 50],   // approaching target: teal
    [t.mid,   135, 85, 50],   // optimal target: vivid green
    [t.high,   80, 85, 55],   // top of target: yellow-green
    [14.7,     55, 95, 55],   // stoich: yellow
    [17.0,     20, 95, 55],   // lean warning: orange
    [AFR_MAX,   0, 90, 45],   // very lean: deep red
  ];
  // Clamp to range
  if (afr <= stops[0][0]) {
    const [, h, s, l] = stops[0];
    return `hsl(${h},${s}%,${l}%)`;
  }
  if (afr >= stops[stops.length - 1][0]) {
    const [, h, s, l] = stops[stops.length - 1];
    return `hsl(${h},${s}%,${l}%)`;
  }
  for (let i = 0; i < stops.length - 1; i++) {
    const [a1, h1, s1, l1] = stops[i];
    const [a2, h2, s2, l2] = stops[i + 1];
    if (afr >= a1 && afr <= a2) {
      const k = (afr - a1) / (a2 - a1);
      const h = h1 + (h2 - h1) * k;
      const s = s1 + (s2 - s1) * k;
      const l = l1 + (l2 - l1) * k;
      return `hsl(${h.toFixed(0)},${s.toFixed(0)}%,${l.toFixed(0)}%)`;
    }
  }
  return "#888";
};

// ─── Cross-browser file text reader (file.text() needs Chrome 76+) ───
const readFileAsText = (file) => new Promise((resolve, reject) => {
  if (typeof file.text === "function") {
    file.text().then(resolve).catch(reject);
    return;
  }
  const reader = new FileReader();
  reader.onload = () => resolve(reader.result);
  reader.onerror = () => reject(reader.error || new Error("FileReader failed"));
  reader.readAsText(file);
});

// ─── Find sample at given elapsed seconds since lap start ────────
// Uses RunTime (absolute session time) to locate the sample. If the
// requested elapsed exceeds the lap's duration, returns the last sample
// (so a fast lap "parks" at the finish while a slower lap continues).
const sampleAtElapsed = (lap, elapsedSec) => {
  if (!lap || !lap.samples.length) return null;
  const t0 = lap.samples[0].RunTime;
  const tEnd = lap.samples[lap.samples.length - 1].RunTime;
  const target = t0 + Math.max(0, Math.min(tEnd - t0, elapsedSec));
  for (let i = 0; i < lap.samples.length; i++) {
    if (lap.samples[i].RunTime >= target) return lap.samples[i];
  }
  return lap.samples[lap.samples.length - 1];
};

// ─── Parse one Drogger CSV ───────────────────────────────────────
const parseSession = (rawData, name, type) => {
  const lapMap = new Map();
  rawData.forEach((row) => {
    const lap = row.Lap;
    if (!lapMap.has(lap)) lapMap.set(lap, { lap, samples: [] });
    lapMap.get(lap).samples.push(row);
  });

  const lapsRaw = [];
  for (const [lap, e] of lapMap.entries()) {
    if (lap < 0) continue;
    const samples = e.samples;
    lapsRaw.push({ lap, samples });
  }
  lapsRaw.sort((a, b) => a.samples[0].RunTime - b.samples[0].RunTime);

  const laps = [];
  for (let i = 0; i < lapsRaw.length; i++) {
    const { lap, samples } = lapsRaw[i];
    // The official lap time for Lap N is stored in Lap N+1's LapTime column
    // (Drogger writes the just-finished lap time into the next lap's samples).
    // For the very last lap, fall back to RunTime delta.
    let dur;
    const next = lapsRaw[i + 1];
    if (next && next.samples[0].LapTime && next.samples[0].LapTime > 0) {
      dur = next.samples[0].LapTime / 1000;
    } else {
      dur = samples[samples.length - 1].RunTime - samples[0].RunTime;
    }
    const speeds = samples.map((s) => s.Speed).filter((s) => s > 0);
    const rpms = samples.map((s) => s.Rpm).filter((s) => s > 0);
    const movingSpeeds = samples.map((s) => s.Speed).filter((s) => s > 5);
    laps.push({
      lap, duration: dur,
      startTime: samples[0].RunTime,
      endTime: samples[samples.length - 1].RunTime,
      maxRpm: rpms.length ? Math.max(...rpms) : 0,
      maxSpeed: speeds.length ? Math.max(...speeds) : 0,
      avgSpeed: movingSpeeds.length ? movingSpeeds.reduce((a, b) => a + b, 0) / movingSpeeds.length : 0,
      samples,
    });
  }
  laps.sort((a, b) => a.startTime - b.startTime);

  const validGps = rawData.filter((r) => r.Latitude > 0 && r.Longitude > 0);
  const lat0 = validGps.length ? validGps.reduce((a, r) => a + r.Latitude, 0) / validGps.length : 0;
  const lon0 = validGps.length ? validGps.reduce((a, r) => a + r.Longitude, 0) / validGps.length : 0;

  // Auto-adaptive racing-lap detection: use median lap time of "plausible"
  // laps (10-600s absolute bounds), then keep laps within 0.55x..1.7x of median.
  // This adapts to short kart courses (~40s) and longer circuits (~110s) alike.
  const plausibleDurations = laps.map((l) => l.duration).filter((d) => d > 10 && d < 600);
  const medianDur = plausibleDurations.length
    ? [...plausibleDurations].sort((a, b) => a - b)[Math.floor(plausibleDurations.length / 2)]
    : 0;
  const racingMin = medianDur > 0 ? medianDur * 0.55 : 10;
  const racingMax = medianDur > 0 ? medianDur * 1.7 : 600;
  laps.forEach((l) => { l.isRacing = l.duration >= racingMin && l.duration <= racingMax; });

  let stints = [];
  let cur = null;
  laps.forEach((lap) => {
    if (!lap.isRacing) {
      if (cur) { stints.push(cur); cur = null; }
      return;
    }
    if (!cur) cur = { id: newId(), startLap: lap.lap, endLap: lap.lap, laps: [lap] };
    else { cur.endLap = lap.lap; cur.laps.push(lap); }
  });
  if (cur) stints.push(cur);

  return {
    id: newId(), name, type, engineType: "4st", laps, stints, medianLap: medianDur, lat0, lon0,
    totalSamples: rawData.length,
    hasAfr: rawData.some((r) => r.Afr && r.Afr > 0),
    hasThrottle: rawData.some((r) => r.ThrottolePos && r.ThrottolePos > 0),
    duration: rawData[rawData.length - 1].RunTime - rawData[0].RunTime,
  };
};

// ─── UI primitives ───────────────────────────────────────────────
const Panel = ({ title, accent, children, className = "" }) => (
  <div className={`bg-[#111720] border border-[#252d3a] ${className}`} style={{ borderRadius: 2 }}>
    {title && (
      <div className="px-3 py-2 border-b border-[#252d3a] flex items-center justify-between">
        <div className="text-[10px] uppercase tracking-[0.18em] font-mono text-gray-500 flex items-center gap-2">
          {accent && <span className="w-1 h-3" style={{ backgroundColor: ACCENT }}></span>}
          {title}
        </div>
      </div>
    )}
    {children}
  </div>
);

const Btn = ({ onClick, children, primary, small, disabled, className = "" }) => (
  <button onClick={onClick} disabled={disabled}
    className={`font-mono uppercase tracking-wider transition-all border ${
      primary ? "bg-yellow-400 border-yellow-400 text-black hover:bg-yellow-300"
              : "bg-transparent border-[#252d3a] text-gray-300 hover:border-yellow-400 hover:text-yellow-400"
    } ${small ? "px-2 py-1 text-[10px]" : "px-3 py-1.5 text-xs"} ${disabled ? "opacity-30 cursor-not-allowed" : "cursor-pointer"} ${className}`}
    style={{ borderRadius: 2 }}>
    {children}
  </button>
);

const Stat = ({ label, value, unit, className = "" }) => (
  <div className={className}>
    <div className="text-[9px] uppercase tracking-[0.15em] font-mono text-gray-500 mb-0.5">{label}</div>
    <div className="font-mono text-gray-100">
      <span className="text-lg">{value}</span>
      {unit && <span className="text-[10px] text-gray-500 ml-1">{unit}</span>}
    </div>
  </div>
);

const RiderSelect = ({ value, onChange, riders, placeholder = "未割当", small = false }) => {
  const selected = riders.find((r) => r.id === value);
  return (
    <div className="relative inline-block">
      <select value={value || ""} onChange={(e) => onChange(e.target.value || null)}
        className={`appearance-none bg-[#0a0e14] border border-[#252d3a] text-gray-200 font-mono pr-6 cursor-pointer hover:border-yellow-400 focus:border-yellow-400 outline-none ${small ? "py-0.5 text-[10px]" : "py-1 text-xs"}`}
        style={{ borderRadius: 2, paddingLeft: selected ? 18 : 8 }}>
        <option value="">{placeholder}</option>
        {riders.map((r) => (<option key={r.id} value={r.id}>{r.name}</option>))}
      </select>
      {selected && (<div className="absolute left-2 top-1/2 -translate-y-1/2 w-2 h-2 pointer-events-none" style={{ background: selected.color }}></div>)}
      <ChevronDown size={10} className="absolute right-1.5 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none" />
    </div>
  );
};

// ─── GPS track plot ──────────────────────────────────────────────
const TrackPlot = ({ lap, lat0, lon0, colorBy = "speed", engineType = "4st", overlay = null, cursorSample = null, overlayCursorSample = null, height = 380 }) => {
  if (!lap || !lap.samples.length) return null;
  const pts = lap.samples.filter((s) => s.Latitude > 0 && s.Longitude > 0)
    .map((s) => { const [x, y] = llToMeters(s.Latitude, s.Longitude, lat0, lon0);
                  return { x, y, speed: s.Speed, rpm: s.Rpm, afr: s.Afr, t: s.LapRunTime }; });
  if (!pts.length) return null;

  const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
  let xmin = Math.min(...xs), xmax = Math.max(...xs);
  let ymin = Math.min(...ys), ymax = Math.max(...ys);
  if (overlay) {
    overlay.samples.filter((s) => s.Latitude > 0 && s.Longitude > 0).forEach((s) => {
      const [x, y] = llToMeters(s.Latitude, s.Longitude, lat0, lon0);
      xmin = Math.min(xmin, x); xmax = Math.max(xmax, x);
      ymin = Math.min(ymin, y); ymax = Math.max(ymax, y);
    });
  }
  const pad = 30, w = 800, h = height;
  const dx = xmax - xmin || 1, dy = ymax - ymin || 1;
  const sx = (w - 2 * pad) / dx, sy = (h - 2 * pad) / dy;
  const sc = Math.min(sx, sy);
  const ox = pad + ((w - 2 * pad) - dx * sc) / 2 - xmin * sc;
  const oy = h - (pad + ((h - 2 * pad) - dy * sc) / 2 - ymin * sc);
  const proj = (x, y) => [x * sc + ox, oy - y * sc];

  const speeds = pts.map((p) => p.speed); const sMin = Math.min(...speeds), sMax = Math.max(...speeds);
  const colorFor = (val) => {
    if (colorBy === "rpm") return rpmColor(val, engineType);
    if (colorBy === "afr") return afrColor(val, engineType);
    const t = (val - sMin) / (sMax - sMin || 1); return `hsl(${280 - t * 280}, 85%, ${30 + t * 30}%)`;
  };

  // Build legend for RPM mode based on the engine stops
  const rpmStops = RPM_STOPS[engineType] || RPM_STOPS["4st"];
  const afrTarget = AFR_TARGETS[engineType] || AFR_TARGETS["4st"];

  const colorByValue = (p) => {
    if (colorBy === "rpm") return p.rpm;
    if (colorBy === "afr") return p.afr;
    return p.speed;
  };

  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{ background: BG }}>
      {[...Array(8)].map((_, i) => (<line key={`vx${i}`} x1={(i * w) / 8} y1={0} x2={(i * w) / 8} y2={h} stroke={STROKE} strokeWidth={0.5} opacity={0.5} />))}
      {[...Array(5)].map((_, i) => (<line key={`vy${i}`} x1={0} y1={(i * h) / 5} x2={w} y2={(i * h) / 5} stroke={STROKE} strokeWidth={0.5} opacity={0.5} />))}
      {overlay && overlay.samples.filter((s) => s.Latitude > 0 && s.Longitude > 0).map((s, i) => {
        const [x, y] = llToMeters(s.Latitude, s.Longitude, lat0, lon0);
        const [px, py] = proj(x, y);
        return <circle key={`o${i}`} cx={px} cy={py} r={1.4} fill={FG_MUTE} opacity={0.35} />;
      })}
      {pts.map((p, i) => { const [px, py] = proj(p.x, p.y);
        return <circle key={i} cx={px} cy={py} r={2} fill={colorFor(colorByValue(p))} />; })}
      {(() => {
        const [sx0, sy0] = proj(pts[0].x, pts[0].y);
        const [ex, ey] = proj(pts[pts.length - 1].x, pts[pts.length - 1].y);
        return (<>
          <circle cx={sx0} cy={sy0} r={6} fill="none" stroke="#22d3ee" strokeWidth={2} />
          <circle cx={ex} cy={ey} r={6} fill="none" stroke={ACCENT} strokeWidth={2} />
          <text x={sx0 + 10} y={sy0 + 4} fill="#22d3ee" fontSize={9} fontFamily="monospace">START</text>
          <text x={ex + 10} y={ey + 4} fill={ACCENT} fontSize={9} fontFamily="monospace">END</text>
        </>);
      })()}
      {/* Animation cursor for compare lap (overlay, cyan) - draw under main */}
      {overlayCursorSample && overlayCursorSample.Latitude > 0 && (() => {
        const [x, y] = llToMeters(overlayCursorSample.Latitude, overlayCursorSample.Longitude, lat0, lon0);
        const [px, py] = proj(x, y);
        return (
          <g>
            <circle cx={px} cy={py} r={12} fill="none" stroke="#22d3ee" strokeWidth={1.5} opacity={0.4} />
            <circle cx={px} cy={py} r={6} fill="#22d3ee" stroke="#0a0e14" strokeWidth={1.5} />
          </g>
        );
      })()}
      {/* Animation cursor for main lap (yellow) */}
      {cursorSample && cursorSample.Latitude > 0 && (() => {
        const [x, y] = llToMeters(cursorSample.Latitude, cursorSample.Longitude, lat0, lon0);
        const [px, py] = proj(x, y);
        return (
          <g>
            <circle cx={px} cy={py} r={14} fill="none" stroke={ACCENT} strokeWidth={1.5} opacity={0.5} />
            <circle cx={px} cy={py} r={7} fill={ACCENT} stroke="#0a0e14" strokeWidth={1.5} />
          </g>
        );
      })()}
      {colorBy === "rpm" ? (
        <g transform={`translate(${w - 200}, 20)`}>
          <text x={0} y={-5} fill={FG_MUTE} fontSize={9} fontFamily="monospace">RPM · {engineType.toUpperCase()}</text>
          {[...Array(40)].map((_, i) => {
            const t = i / 39;
            const r = rpmStops.low + t * (rpmStops.high - rpmStops.low);
            return <rect key={i} x={i * 4.5} y={0} width={4.6} height={6} fill={rpmColor(r, engineType)} />;
          })}
          <line x1={((rpmStops.mid - rpmStops.low) / (rpmStops.high - rpmStops.low)) * 180} y1={-2} x2={((rpmStops.mid - rpmStops.low) / (rpmStops.high - rpmStops.low)) * 180} y2={8} stroke={FG} strokeWidth={0.5} />
          <text x={0} y={20} fill={FG_DIM} fontSize={9} fontFamily="monospace">{rpmStops.low.toLocaleString()}</text>
          <text x={((rpmStops.mid - rpmStops.low) / (rpmStops.high - rpmStops.low)) * 180} y={20} textAnchor="middle" fill={FG_DIM} fontSize={9} fontFamily="monospace">{rpmStops.mid.toLocaleString()}</text>
          <text x={180} y={20} textAnchor="end" fill={FG_DIM} fontSize={9} fontFamily="monospace">{rpmStops.high.toLocaleString()}</text>
        </g>
      ) : colorBy === "afr" ? (
        <g transform={`translate(${w - 220}, 20)`}>
          <text x={0} y={-5} fill={FG_MUTE} fontSize={9} fontFamily="monospace">A/F · {engineType.toUpperCase()} · target {afrTarget.mid}</text>
          {[...Array(60)].map((_, i) => {
            const t = i / 59;
            const a = AFR_MIN + t * (AFR_MAX - AFR_MIN);
            return <rect key={i} x={i * 3.3} y={0} width={3.4} height={6} fill={afrColor(a, engineType)} />;
          })}
          {/* Tick marks for target band */}
          {[afrTarget.low, afrTarget.mid, afrTarget.high].map((v, i) => {
            const x = ((v - AFR_MIN) / (AFR_MAX - AFR_MIN)) * 198;
            return <line key={i} x1={x} y1={-2} x2={x} y2={8} stroke={FG} strokeWidth={i === 1 ? 1 : 0.5} />;
          })}
          <text x={0} y={20} fill={FG_DIM} fontSize={9} fontFamily="monospace">{AFR_MIN.toFixed(1)}</text>
          <text x={((afrTarget.mid - AFR_MIN) / (AFR_MAX - AFR_MIN)) * 198} y={20} textAnchor="middle" fill={ACCENT} fontSize={9} fontFamily="monospace">{afrTarget.mid.toFixed(1)}</text>
          <text x={198} y={20} textAnchor="end" fill={FG_DIM} fontSize={9} fontFamily="monospace">{AFR_MAX.toFixed(1)}</text>
        </g>
      ) : (
        <g transform={`translate(${w - 130}, 20)`}>
          <text x={0} y={-5} fill={FG_MUTE} fontSize={9} fontFamily="monospace">SPEED km/h</text>
          {[0, 0.25, 0.5, 0.75, 1].map((t, i) => (
            <rect key={i} x={i * 24} y={0} width={24} height={6} fill={`hsl(${280 - t * 280}, 85%, ${30 + t * 30}%)`} />
          ))}
          <text x={0} y={20} fill={FG_DIM} fontSize={9} fontFamily="monospace">{fmtNum(sMin, 0)}</text>
          <text x={120} y={20} textAnchor="end" fill={FG_DIM} fontSize={9} fontFamily="monospace">{fmtNum(sMax, 0)}</text>
        </g>
      )}
    </svg>
  );
};

const TracePlot = ({ lapA, lapB, mode = "speed", height = 280, label, cursorSampleA = null, cursorSampleB = null }) => {
  if (!lapA) return null;
  const w = 800, h = height, pad = { l: 50, r: 20, t: 20, b: 30 };
  const distOf = (lap) => {
    let d = 0; let lastLat = null, lastLon = null;
    const lat0Lap = lap.samples.find((s) => s.Latitude > 0)?.Latitude || 0;
    const lon0Lap = lap.samples.find((s) => s.Longitude > 0)?.Longitude || 0;
    return lap.samples.map((s) => {
      if (s.Latitude > 0) {
        if (lastLat !== null) {
          const [x, y] = llToMeters(s.Latitude, s.Longitude, lat0Lap, lon0Lap);
          const [lx, ly] = llToMeters(lastLat, lastLon, lat0Lap, lon0Lap);
          d += Math.hypot(x - lx, y - ly);
        }
        lastLat = s.Latitude; lastLon = s.Longitude;
      }
      return { d, v: mode === "speed" ? s.Speed : s.Rpm, t: s.LapRunTime, runTime: s.RunTime };
    });
  };
  const a = distOf(lapA);
  const b = lapB ? distOf(lapB) : null;
  const allD = [...a.map((p) => p.d), ...(b ? b.map((p) => p.d) : [])];
  const allV = [...a.map((p) => p.v), ...(b ? b.map((p) => p.v) : [])];
  const dMax = Math.max(...allD), dMin = 0;
  const vMin = mode === "speed" ? 0 : Math.max(0, Math.min(...allV) - 500);
  const vMax = Math.max(...allV) * 1.05;
  const sx = (d) => pad.l + ((d - dMin) / (dMax - dMin)) * (w - pad.l - pad.r);
  const sy = (v) => h - pad.b - ((v - vMin) / (vMax - vMin)) * (h - pad.t - pad.b);
  const pathOf = (arr) => arr.map((p, i) => `${i ? "L" : "M"}${sx(p.d).toFixed(1)},${sy(p.v).toFixed(1)}`).join("");
  const yTicks = mode === "speed" ? [0, 25, 50, 75, 100] : [0, 5000, 10000, 15000];

  // Find distance for cursor: locate sample by RunTime match in our distOf array
  const cursorDistFor = (lap, sampleArr, cursorSample) => {
    if (!cursorSample) return null;
    const idx = lap.samples.indexOf(cursorSample);
    if (idx < 0 || idx >= sampleArr.length) return null;
    return sampleArr[idx];
  };
  const cursorA = cursorDistFor(lapA, a, cursorSampleA);
  const cursorB = lapB ? cursorDistFor(lapB, b, cursorSampleB) : null;

  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{ background: BG }}>
      {yTicks.map((v) => v >= vMin && v <= vMax ? (
        <g key={v}>
          <line x1={pad.l} y1={sy(v)} x2={w - pad.r} y2={sy(v)} stroke={STROKE} strokeWidth={0.5} />
          <text x={pad.l - 6} y={sy(v) + 3} fill={FG_MUTE} fontSize={9} fontFamily="monospace" textAnchor="end">{v}</text>
        </g>) : null)}
      {[0, 0.25, 0.5, 0.75, 1].map((t, i) => (
        <text key={i} x={pad.l + t * (w - pad.l - pad.r)} y={h - pad.b + 14} fill={FG_MUTE} fontSize={9} fontFamily="monospace" textAnchor="middle">{(t * dMax).toFixed(0)}m</text>
      ))}
      {b && <path d={pathOf(b)} fill="none" stroke="#22d3ee" strokeWidth={1.3} opacity={0.85} />}
      <path d={pathOf(a)} fill="none" stroke={ACCENT} strokeWidth={1.5} />
      {/* Cursor: vertical line + dot at current sample */}
      {cursorB && (
        <g>
          <line x1={sx(cursorB.d)} y1={pad.t} x2={sx(cursorB.d)} y2={h - pad.b} stroke="#22d3ee" strokeWidth={0.6} opacity={0.5} />
          <circle cx={sx(cursorB.d)} cy={sy(cursorB.v)} r={4} fill="#22d3ee" stroke="#0a0e14" strokeWidth={1} />
        </g>
      )}
      {cursorA && (
        <g>
          <line x1={sx(cursorA.d)} y1={pad.t} x2={sx(cursorA.d)} y2={h - pad.b} stroke={ACCENT} strokeWidth={0.8} opacity={0.7} />
          <circle cx={sx(cursorA.d)} cy={sy(cursorA.v)} r={4.5} fill={ACCENT} stroke="#0a0e14" strokeWidth={1} />
          <text x={sx(cursorA.d) + 6} y={pad.t + 10} fill={ACCENT} fontSize={9} fontFamily="monospace">
            {cursorA.d.toFixed(0)}m
          </text>
        </g>
      )}
      {label && <text x={pad.l + 6} y={pad.t + 12} fill={FG_DIM} fontSize={10} fontFamily="monospace">{label}</text>}
    </svg>
  );
};

const LapTimesChart = ({ session, lookupRiderForLap, onLapClick, selectedLap, height = 320 }) => {
  if (!session) return null;
  const w = 800, h = height, pad = { l: 60, r: 20, t: 20, b: 40 };
  const racing = session.laps.filter((l) => l.isRacing);
  if (!racing.length) return <div className="text-gray-500 p-6 text-center text-sm font-mono">レーシングラップが検出できません</div>;
  const tMax = Math.max(...racing.map((l) => l.duration)) * 1.05;
  const tMin = Math.min(...racing.map((l) => l.duration)) * 0.95;
  const xMax = Math.max(...racing.map((l) => l.endTime));
  const sx = (t) => pad.l + (t / xMax) * (w - pad.l - pad.r);
  const sy = (d) => h - pad.b - ((d - tMin) / (tMax - tMin)) * (h - pad.t - pad.b);
  const bestDur = Math.min(...racing.map((l) => l.duration));
  const yStep = Math.max(1, Math.ceil((tMax - tMin) / 5));
  const yTicks = [];
  for (let v = Math.ceil(tMin); v <= tMax; v += yStep) yTicks.push(v);
  const xTicks = [];
  for (let m = 0; m * 60 <= xMax; m += Math.max(1, Math.floor(xMax / 60 / 8))) xTicks.push(m * 60);
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{ background: BG }}>
      {yTicks.map((v) => (
        <g key={`y${v}`}>
          <line x1={pad.l} y1={sy(v)} x2={w - pad.r} y2={sy(v)} stroke={STROKE} strokeWidth={0.5} />
          <text x={pad.l - 8} y={sy(v) + 3} fill={FG_MUTE} fontSize={10} fontFamily="monospace" textAnchor="end">{fmtTime(v)}</text>
        </g>
      ))}
      {xTicks.map((t) => (
        <g key={`x${t}`}>
          <line x1={sx(t)} y1={pad.t} x2={sx(t)} y2={h - pad.b} stroke={STROKE} strokeWidth={0.3} opacity={0.5} />
          <text x={sx(t)} y={h - pad.b + 14} fill={FG_MUTE} fontSize={9} fontFamily="monospace" textAnchor="middle">{Math.floor(t / 60)}m</text>
        </g>
      ))}
      <line x1={pad.l} y1={sy(bestDur)} x2={w - pad.r} y2={sy(bestDur)} stroke={ACCENT} strokeWidth={0.5} strokeDasharray="3 3" opacity={0.6} />
      <text x={w - pad.r - 4} y={sy(bestDur) - 4} fill={ACCENT} fontSize={9} fontFamily="monospace" textAnchor="end">BEST {fmtTime(bestDur)}</text>
      {racing.map((lap) => {
        const r = lookupRiderForLap(lap.lap);
        const color = r ? r.color : FG_MUTE;
        const isSelected = selectedLap === lap.lap;
        const isBest = lap.duration === bestDur;
        return (
          <g key={lap.lap} className="cursor-pointer" onClick={() => onLapClick && onLapClick(lap.lap)}>
            <circle cx={sx(lap.endTime)} cy={sy(lap.duration)} r={isSelected ? 6 : isBest ? 5 : 3.5}
              fill={isBest ? ACCENT : color} stroke={isSelected ? FG : "none"} strokeWidth={isSelected ? 2 : 0} opacity={r ? 0.95 : 0.5} />
            {(isBest || isSelected) && (
              <text x={sx(lap.endTime)} y={sy(lap.duration) - 9} fill={FG} fontSize={9} fontFamily="monospace" textAnchor="middle">L{lap.lap}</text>
            )}
          </g>
        );
      })}
      <text x={pad.l} y={pad.t + 10} fill={FG_DIM} fontSize={10} fontFamily="monospace">LAP TIME ↑   ELAPSED TIME →</text>
    </svg>
  );
};

const PaceEvolution = ({ session, height = 200 }) => {
  if (!session) return null;
  const w = 800, h = height, pad = { l: 60, r: 20, t: 20, b: 30 };
  const racing = session.laps.filter((l) => l.isRacing);
  if (racing.length < 3) return null;
  const tMax = Math.max(...racing.map((l) => l.duration)) * 1.05;
  const tMin = Math.min(...racing.map((l) => l.duration)) * 0.95;
  const xMax = Math.max(...racing.map((l) => l.endTime));
  const sx = (t) => pad.l + (t / xMax) * (w - pad.l - pad.r);
  const sy = (d) => h - pad.b - ((d - tMin) / (tMax - tMin)) * (h - pad.t - pad.b);
  const win = 3;
  const rolling = racing.map((lap, i) => {
    const lo = Math.max(0, i - Math.floor(win / 2));
    const hi = Math.min(racing.length, lo + win);
    const slice = racing.slice(lo, hi);
    return { t: lap.endTime, v: slice.reduce((a, l) => a + l.duration, 0) / slice.length };
  });
  const path = rolling.map((p, i) => `${i ? "L" : "M"}${sx(p.t).toFixed(1)},${sy(p.v).toFixed(1)}`).join("");
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{ background: BG }}>
      {[tMin, (tMin + tMax) / 2, tMax].map((v) => (
        <g key={v}>
          <line x1={pad.l} y1={sy(v)} x2={w - pad.r} y2={sy(v)} stroke={STROKE} strokeWidth={0.3} />
          <text x={pad.l - 6} y={sy(v) + 3} fill={FG_MUTE} fontSize={9} fontFamily="monospace" textAnchor="end">{fmtTime(v)}</text>
        </g>
      ))}
      <path d={path} fill="none" stroke="#22d3ee" strokeWidth={1.5} />
      {racing.map((lap, i) => (<circle key={i} cx={sx(lap.endTime)} cy={sy(lap.duration)} r={1.5} fill={FG_DIM} opacity={0.5} />))}
    </svg>
  );
};

// ─── Responsive: detect mobile (< 768px) ─────────────────────────
const useIsMobile = (breakpoint = 768) => {
  const [isMobile, setIsMobile] = useState(typeof window !== "undefined" ? window.innerWidth < breakpoint : false);
  useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth < breakpoint);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, [breakpoint]);
  return isMobile;
};

// ─── Main app ────────────────────────────────────────────────────
function DroggerAnalyzer() {
  const [sessions, setSessions] = useState([]);
  const [activeSessionId, setActiveSessionId] = useState(null);
  const [riders, setRiders] = useState([]);
  const [stintAssignments, setStintAssignments] = useState({});
  const [activeTab, setActiveTab] = useState("overview");
  const [selectedLap, setSelectedLap] = useState(null);
  const [compareLap, setCompareLap] = useState(null);
  const [parseError, setParseError] = useState(null);
  // Playback (animation) state
  const [playbackProgress, setPlaybackProgress] = useState(0);   // 0-1
  const [isPlaying, setIsPlaying] = useState(false);
  const [playbackSpeed, setPlaybackSpeed] = useState(1);          // 0.25 / 0.5 / 1 / 2 / 4
  // Mobile responsive
  const isMobile = useIsMobile();
  const [drawerOpen, setDrawerOpen] = useState(false);
  const fileInputRef = useRef(null);

  const activeSession = sessions.find((s) => s.id === activeSessionId);
  const activeStintMap = activeSession ? (stintAssignments[activeSession.id] || {}) : {};

  const handleFiles = useCallback(async (fileList) => {
    setParseError(null);
    const files = Array.from(fileList);
    const newSessions = [];
    for (const file of files) {
      try {
        const text = await readFileAsText(file);
        const parsed = Papa.parse(text, { header: true, dynamicTyping: true, skipEmptyLines: true });
        if (!parsed.data.length || !("Lap" in parsed.data[0])) {
          setParseError(`${file.name}: Drogger CSVではないようです（Lap列がありません）`);
          continue;
        }
        const lc = file.name.toLowerCase();
        const isRace = lc.includes("race") || file.name.includes("本番");
        const isQual = lc.includes("qual") || file.name.includes("予選");
        const type = isRace ? "race" : isQual ? "qualifying" : "practice";
        const session = parseSession(parsed.data, file.name.replace(/\.csv$/i, ""), type);
        newSessions.push(session);
      } catch (e) { setParseError(`${file.name}: ${e.message}`); }
    }
    if (newSessions.length) {
      setSessions((prev) => [...prev, ...newSessions]);
      if (!activeSessionId) setActiveSessionId(newSessions[0].id);
      setStintAssignments((sa) => {
        const next = { ...sa };
        newSessions.forEach((s) => { if (!next[s.id]) next[s.id] = {}; });
        return next;
      });
      setRiders((rs) => rs.length === 0 ? [{ id: newId(), name: "Rider 1", color: RIDER_COLORS[0] }] : rs);
    }
  }, [activeSessionId]);

  const removeSession = (id) => {
    setSessions((s) => s.filter((x) => x.id !== id));
    if (activeSessionId === id) setActiveSessionId(sessions.find((s) => s.id !== id)?.id || null);
    setStintAssignments((sa) => { const c = { ...sa }; delete c[id]; return c; });
  };

  const setSessionEngineType = (id, engineType) => {
    setSessions((ss) => ss.map((s) => (s.id === id ? { ...s, engineType } : s)));
  };

  const addRider = () => {
    setRiders((rs) => [...rs, { id: newId(), name: `Rider ${rs.length + 1}`, color: RIDER_COLORS[rs.length % RIDER_COLORS.length] }]);
  };
  const updateRider = (id, key, val) => setRiders((rs) => rs.map((r) => (r.id === id ? { ...r, [key]: val } : r)));
  const removeRider = (id) => {
    setRiders((rs) => rs.filter((r) => r.id !== id));
    setStintAssignments((sa) => {
      const next = {};
      for (const sid of Object.keys(sa)) {
        next[sid] = {};
        for (const stintId of Object.keys(sa[sid])) {
          if (sa[sid][stintId] !== id) next[sid][stintId] = sa[sid][stintId];
        }
      }
      return next;
    });
  };

  const assignStintToRider = (sessionId, stintId, riderId) => {
    setStintAssignments((sa) => {
      const sessMap = { ...(sa[sessionId] || {}) };
      if (riderId) sessMap[stintId] = riderId;
      else delete sessMap[stintId];
      return { ...sa, [sessionId]: sessMap };
    });
  };

  const lookupRiderForLap = useCallback((lapNum) => {
    if (!activeSession) return null;
    const stint = activeSession.stints.find((st) => lapNum >= st.startLap && lapNum <= st.endLap);
    if (!stint) return null;
    const riderId = activeStintMap[stint.id];
    if (!riderId) return null;
    return riders.find((r) => r.id === riderId) || null;
  }, [activeSession, activeStintMap, riders]);

  const riderStats = useMemo(() => {
    if (!activeSession) return [];
    return riders.map((r) => {
      const myStintIds = Object.keys(activeStintMap).filter((sid) => activeStintMap[sid] === r.id);
      const myStints = activeSession.stints.filter((st) => myStintIds.includes(st.id));
      const allLaps = myStints.flatMap((st) => st.laps).filter((l) => l.isRacing);
      if (!allLaps.length) return { ...r, lapCount: 0, stintCount: myStints.length };
      const durations = allLaps.map((l) => l.duration).sort((a, b) => a - b);
      return { ...r, lapCount: allLaps.length, stintCount: myStints.length,
        bestLap: durations[0], avgLap: durations.reduce((a, b) => a + b, 0) / durations.length,
        worstLap: durations[durations.length - 1], consistency: durations[durations.length - 1] - durations[0],
        maxRpm: Math.max(...allLaps.map((l) => l.maxRpm)), maxSpeed: Math.max(...allLaps.map((l) => l.maxSpeed)) };
    });
  }, [activeSession, activeStintMap, riders]);

  const theoreticalBest = useMemo(() => {
    if (!activeSession) return null;
    const racing = activeSession.laps.filter((l) => l.isRacing);
    if (racing.length < 2) return null;
    const N = 6;
    const sectorBest = new Array(N).fill(Infinity);
    racing.forEach((lap) => {
      const sectorDur = lap.duration / N;
      for (let i = 0; i < N; i++) if (sectorDur < sectorBest[i]) sectorBest[i] = sectorDur;
    });
    return { sectors: sectorBest, total: sectorBest.reduce((a, b) => a + b, 0), N };
  }, [activeSession]);

  const selectedLapObj = activeSession?.laps.find((l) => l.lap === selectedLap);
  const compareLapObj = activeSession?.laps.find((l) => l.lap === compareLap);

  // Reset playback when lap selection changes
  useEffect(() => {
    setPlaybackProgress(0);
    setIsPlaying(false);
  }, [selectedLap, compareLap, activeTab]);

  // The wall-clock span that progress 0-1 covers. In Compare mode, the
  // longer of the two lap durations so both finish within view.
  const playbackDuration = useMemo(() => {
    if (!selectedLapObj) return 0;
    if (activeTab === "compare" && compareLapObj) {
      return Math.max(selectedLapObj.duration, compareLapObj.duration);
    }
    return selectedLapObj.duration;
  }, [selectedLapObj, compareLapObj, activeTab]);

  // Animation loop using requestAnimationFrame
  useEffect(() => {
    if (!isPlaying || !playbackDuration) return;
    let lastTime = performance.now();
    let raf;
    const tick = (now) => {
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      setPlaybackProgress((p) => {
        const next = p + (dt * playbackSpeed) / playbackDuration;
        if (next >= 1) { setIsPlaying(false); return 1; }
        return next;
      });
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [isPlaying, playbackSpeed, playbackDuration]);

  const togglePlay = () => {
    if (playbackProgress >= 1) {
      setPlaybackProgress(0);
      setIsPlaying(true);
    } else {
      setIsPlaying((p) => !p);
    }
  };
  const resetPlay = () => { setPlaybackProgress(0); setIsPlaying(false); };

  const elapsedSec = playbackProgress * playbackDuration;
  const refCursor = selectedLapObj ? sampleAtElapsed(selectedLapObj, elapsedSec) : null;
  const cmpCursor = compareLapObj ? sampleAtElapsed(compareLapObj, elapsedSec) : null;
  // Capped elapsed for each lap (so a fast lap's clock parks at its laptime)
  const refElapsedDisplay = selectedLapObj ? Math.min(elapsedSec, selectedLapObj.duration) : 0;
  const cmpElapsedDisplay = compareLapObj ? Math.min(elapsedSec, compareLapObj.duration) : 0;

  return (
    <div className="min-h-screen w-full" style={{ background: BG, color: FG, fontFamily: "ui-sans-serif, system-ui, -apple-system" }}>
      <div className="border-b border-[#252d3a] flex items-center justify-between" style={{ background: PANEL, padding: isMobile ? "10px 12px" : "12px 16px" }}>
        <div className="flex items-center gap-2 min-w-0">
          {isMobile && (
            <button onClick={() => setDrawerOpen(true)} className="p-2 -ml-2 text-gray-300 active:text-yellow-400" style={{ touchAction: "manipulation" }}>
              <Menu size={22} />
            </button>
          )}
          <div className="w-2 h-6" style={{ background: ACCENT }}></div>
          <div className="min-w-0">
            <div className="font-mono text-sm tracking-[0.2em] uppercase truncate">{isMobile ? "DROGGER" : "Drogger // Telemetry"}</div>
            {!isMobile && (
              <div className="font-mono text-[9px] tracking-wider text-gray-500 uppercase">Endurance Analyzer v1.1 · Standalone</div>
            )}
          </div>
        </div>
        <div className="flex items-center gap-2 flex-shrink-0">
          <input ref={fileInputRef} type="file" accept=".csv,text/csv,text/plain,application/vnd.ms-excel,application/csv" multiple className="hidden"
            onChange={(e) => { if (e.target.files) handleFiles(e.target.files); }} />
          <Btn onClick={() => fileInputRef.current?.click()} primary>
            <Upload size={12} className="inline mr-1.5" />{isMobile ? "CSV" : "CSV Load"}
          </Btn>
        </div>
      </div>

      {parseError && (

                          </div>
                        ) : (
                          <div className="p-3 text-gray-600 font-mono text-xs flex items-center" style={{ borderLeft: "3px solid #22d3ee" }}>
                            Compare lap not selected
                          </div>
                        )}
                      </div>
                    </Panel>

                    <Panel title="Track Overlay" accent>
                      <TrackPlot lap={selectedLapObj} overlay={compareLapObj} lat0={activeSession.lat0} lon0={activeSession.lon0}
                        cursorSample={refCursor} overlayCursorSample={cmpCursor} height={isMobile ? 360 : 380} />
                    </Panel>
                    <Panel title="Speed Trace" accent><div className="p-2"><TracePlot lapA={selectedLapObj} lapB={compareLapObj} mode="speed" label="km/h vs distance" cursorSampleA={refCursor} cursorSampleB={cmpCursor} /></div></Panel>
                    <Panel title="RPM Trace" accent><div className="p-2"><TracePlot lapA={selectedLapObj} lapB={compareLapObj} mode="rpm" label="rpm vs distance" cursorSampleA={refCursor} cursorSampleB={cmpCursor} /></div></Panel>
                    {compareLapObj && (
                      <div className={`grid gap-3 ${isMobile ? "grid-cols-2" : "grid-cols-4"}`}>
                        <Panel className="p-3"><Stat label="Δ Lap Time" value={(selectedLapObj.duration - compareLapObj.duration).toFixed(3)} unit="s" /></Panel>
                        <Panel className="p-3"><Stat label="Δ Max RPM" value={(selectedLapObj.maxRpm - compareLapObj.maxRpm).toFixed(0)} /></Panel>
                        <Panel className="p-3"><Stat label="Δ Max Speed" value={fmtNum(selectedLapObj.maxSpeed - compareLapObj.maxSpeed, 1)} unit="km/h" /></Panel>
                        <Panel className="p-3"><Stat label="Δ Avg Speed" value={fmtNum(selectedLapObj.avgSpeed - compareLapObj.avgSpeed, 1)} unit="km/h" /></Panel>
                      </div>
                    )}
                  </>)}
                </>)}

                {activeTab === "riders" && (
                  <Panel title="Per-Rider Statistics — aggregated across assigned stints" accent>
                    {riderStats.length === 0 ? (
                      <div className="p-8 text-center text-gray-500 font-mono text-xs">ライダーをロスターに追加してください</div>
                    ) : (
                      <table className="w-full font-mono text-xs">
                        <thead>
                          <tr className="border-b border-[#252d3a]">
                            {["Rider", "Stints", "Laps", "Best", "Avg", "Worst", "Spread", "MaxRpm", "TopSpd"].map((h) => (
                              <th key={h} className="px-3 py-2 text-left text-[10px] uppercase tracking-wider text-gray-500">{h}</th>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {riderStats.map((r) => (
                            <tr key={r.id} className="border-b border-[#1a212c] hover:bg-[#1a212c]">
                              <td className="px-3 py-2">
                                <div className="flex items-center gap-2">
                                  <div className="w-2 h-2" style={{ background: r.color }}></div>
                                  <span className="text-gray-200">{r.name}</span>
                                </div>
                              </td>
                              <td className="px-3 py-2 text-gray-400">{r.stintCount || 0}</td>
                              <td className="px-3 py-2 text-gray-300">{r.lapCount || 0}</td>
                              <td className="px-3 py-2 text-yellow-400">{r.bestLap ? fmtTime(r.bestLap) : "—"}</td>
                              <td className="px-3 py-2 text-gray-300">{r.avgLap ? fmtTime(r.avgLap) : "—"}</td>
                              <td className="px-3 py-2 text-gray-500">{r.worstLap ? fmtTime(r.worstLap) : "—"}</td>
                              <td className="px-3 py-2 text-gray-400">{r.consistency != null ? `+${r.consistency.toFixed(2)}s` : "—"}</td>
                              <td className="px-3 py-2 text-gray-300">{r.maxRpm || "—"}</td>
                              <td className="px-3 py-2 text-gray-300">{r.maxSpeed ? fmtNum(r.maxSpeed, 1) : "—"}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    )}
                  </Panel>
                )}

                {activeTab === "strategy" && (<>
                  <div className="grid grid-cols-3 gap-3">
                    <Panel className="p-3 col-span-1">
                      <div className="text-[10px] uppercase tracking-[0.18em] font-mono text-gray-500 mb-2">Theoretical Best</div>
                      {theoreticalBest ? (<>
                        <div className="font-mono text-2xl text-yellow-400 mb-2">{fmtTime(theoreticalBest.total)}</div>
                        <div className="font-mono text-[10px] text-gray-500 mb-3">From {theoreticalBest.N} sector best segments (placeholder)</div>
                        <div className="space-y-1">
                          {theoreticalBest.sectors.map((s, i) => (
                            <div key={i} className="flex justify-between font-mono text-[10px]">
                              <span className="text-gray-500">SEC {i + 1}</span>
                              <span className="text-gray-200">{s.toFixed(3)}s</span>
                            </div>
                          ))}
                        </div>
                      </>) : (<div className="text-gray-500 text-xs font-mono">Need ≥2 laps</div>)}
                    </Panel>
                    <Panel className="p-3 col-span-2">
                      <div className="text-[10px] uppercase tracking-[0.18em] font-mono text-gray-500 mb-2">Stints — assign rider here too</div>
                      <div className="space-y-2">
                        {activeSession.stints.map((st, i) => {
                          const riderId = activeStintMap[st.id];
                          const r = riders.find((rr) => rr.id === riderId);
                          const dur = st.laps.reduce((a, l) => a + l.duration, 0);
                          const best = Math.min(...st.laps.map((l) => l.duration));
                          const avg = dur / st.laps.length;
                          return (
                            <div key={st.id} className="border border-[#252d3a] p-2 flex items-center justify-between font-mono text-xs"
                              style={{ background: PANEL_2, borderLeftColor: r ? r.color : STROKE, borderLeftWidth: 2 }}>
                              <div className="flex items-center gap-3 flex-1">
                                <div>
                                  <div className="text-gray-200">STINT {i + 1}: L{st.startLap}–L{st.endLap}</div>
                                  <div className="flex gap-3 text-[10px] mt-0.5">
                                    <span className="text-gray-500">{st.laps.length} laps</span>
                                    <span className="text-gray-500">{(dur / 60).toFixed(1)}m</span>
                                    <span><span className="text-gray-500">best </span><span className="text-yellow-400">{fmtTime(best)}</span></span>
                                    <span><span className="text-gray-500">avg </span><span className="text-gray-200">{fmtTime(avg)}</span></span>
                                  </div>
                                </div>
                              </div>
                              <RiderSelect value={riderId} onChange={(rid) => assignStintToRider(activeSession.id, st.id, rid)} riders={riders} placeholder="未割当" />
                            </div>
                          );
                        })}
                      </div>
                    </Panel>
                  </div>
                  <Panel title="Lap-by-lap detail" accent>
                    <div className="max-h-96 overflow-y-auto">
                      <table className="w-full font-mono text-xs">
                        <thead className="sticky top-0" style={{ background: PANEL }}>
                          <tr className="border-b border-[#252d3a]">
                            {["Lap", "Time", "Δ Best", "MaxRPM", "MaxSpd", "AvgSpd", "Rider"].map((h) => (
                              <th key={h} className="px-3 py-2 text-left text-[10px] uppercase tracking-wider text-gray-500">{h}</th>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {(() => {
                            const racing = activeSession.laps.filter((l) => l.isRacing);
                            const best = racing.length ? Math.min(...racing.map((l) => l.duration)) : 0;
                            return racing.map((lap) => {
                              const r = lookupRiderForLap(lap.lap);
                              const isBest = lap.duration === best;
                              return (
                                <tr key={lap.lap} className={`border-b border-[#1a212c] hover:bg-[#1a212c] ${isBest ? "bg-yellow-400/5" : ""}`}>
                                  <td className="px-3 py-1.5 text-gray-200">L{lap.lap}</td>
                                  <td className={`px-3 py-1.5 ${isBest ? "text-yellow-400" : "text-gray-200"}`}>{fmtTime(lap.duration)}</td>
                                  <td className="px-3 py-1.5 text-gray-400">+{(lap.duration - best).toFixed(3)}</td>
                                  <td className="px-3 py-1.5 text-gray-300">{lap.maxRpm}</td>
                                  <td className="px-3 py-1.5 text-gray-300">{fmtNum(lap.maxSpeed, 1)}</td>
                                  <td className="px-3 py-1.5 text-gray-300">{fmtNum(lap.avgSpeed, 1)}</td>
                                  <td className="px-3 py-1.5">
                                    {r ? (
                                      <span className="flex items-center gap-1.5">
                                        <div className="w-2 h-2" style={{ background: r.color }}></div>
                                        <span className="text-gray-300">{r.name}</span>
                                      </span>
                                    ) : (<span className="text-gray-600">—</span>)}
                                  </td>
                                </tr>
                              );
                            });
                          })()}
                        </tbody>
                      </table>
                    </div>
                  </Panel>
                </>)}

                {activeTab === "tuning" && activeSession.hasAfr && (() => {
                  const allSamples = activeSession.laps.flatMap((l) => l.samples)
                    .filter((s) => s.Rpm > 1000 && s.Afr >= AFR_MIN && s.Afr <= AFR_MAX);
                  if (!allSamples.length) {
                    return (<Panel className="p-8 text-center text-gray-500 font-mono text-xs">A/Fデータが解析できません</Panel>);
                  }
                  const target = AFR_TARGETS[activeSession.engineType] || AFR_TARGETS["4st"];

                  const nBins = 24;
                  const binSize = (AFR_MAX - AFR_MIN) / nBins;
                  const bins = new Array(nBins).fill(0);
                  allSamples.forEach((s) => {
                    const b = Math.min(nBins - 1, Math.max(0, Math.floor((s.Afr - AFR_MIN) / binSize)));
                    bins[b]++;
                  });
                  const binMax = Math.max(...bins);
                  const totalSamples = allSamples.length;

                  const lapWOT = activeSession.laps
                    .filter((l) => l.isRacing)
                    .map((l) => {
                      const wot = l.samples.filter((s) => s.ThrottolePos > 60 && s.Afr >= AFR_MIN);
                      const avg = wot.length ? wot.reduce((a, s) => a + s.Afr, 0) / wot.length : null;
                      return { lap: l.lap, avg, count: wot.length };
                    })
                    .filter((d) => d.avg != null);

                  const stride = Math.max(1, Math.floor(allSamples.length / 2000));
                  const scatter = allSamples.filter((_, i) => i % stride === 0);

                  const sortedAfr = allSamples.map((s) => s.Afr).sort((a, b) => a - b);
                  const median = sortedAfr[Math.floor(sortedAfr.length / 2)];
                  const inTarget = allSamples.filter((s) => s.Afr >= target.low && s.Afr <= target.high).length;
                  const tooLean = allSamples.filter((s) => s.Afr > target.high).length;
                  const tooRich = allSamples.filter((s) => s.Afr < target.low).length;

                  return (<>
                    <Panel className="p-3">
                      <div className="text-[10px] uppercase tracking-[0.18em] font-mono text-gray-500 mb-2">
                        A/F Summary — engine: {activeSession.engineType.toUpperCase()} · target {target.low}–{target.high}
                      </div>
                      <div className={`grid gap-3 ${isMobile ? "grid-cols-2" : "grid-cols-5"}`}>
                        <Stat label="Samples" value={totalSamples.toLocaleString()} />
                        <Stat label="Median A/F" value={median.toFixed(2)} />
                        <Stat label="In Target" value={`${(100 * inTarget / totalSamples).toFixed(1)}%`} />
                        <Stat label="Rich" value={`${(100 * tooRich / totalSamples).toFixed(1)}%`} />
                        <Stat label="Lean" value={`${(100 * tooLean / totalSamples).toFixed(1)}%`} />
                      </div>
                    </Panel>

                    <Panel title="A/F Histogram (full session)" accent>
                      <svg viewBox="0 0 800 240" className="w-full" style={{ background: BG }}>
                        {[0.25, 0.5, 0.75, 1].map((t, i) => (
                          <line key={i} x1={50} y1={20 + (180 * (1 - t))} x2={780} y2={20 + (180 * (1 - t))} stroke={STROKE} strokeWidth={0.5} />
                        ))}
                        {bins.map((count, i) => {
                          const afrLow = AFR_MIN + i * binSize;
                          const afrCenter = afrLow + binSize / 2;
                          const barH = (count / binMax) * 180;
                          const xL = 50 + (i * (730 / nBins));
                          const wd = 730 / nBins - 1;
                          return (<rect key={i} x={xL} y={200 - barH} width={wd} height={barH} fill={afrColor(afrCenter, activeSession.engineType)} />);
                        })}
                        <rect x={50 + ((target.low - AFR_MIN) / (AFR_MAX - AFR_MIN)) * 730}
                              y={20}
                              width={((target.high - target.low) / (AFR_MAX - AFR_MIN)) * 730}
                              height={180}
                              fill="none" stroke={ACCENT} strokeWidth={1} strokeDasharray="3 3" opacity={0.7} />
                        {[8, 10, 12, 14, 14.7, 16, 18, 20].map((v, i) => {
                          const x = 50 + ((v - AFR_MIN) / (AFR_MAX - AFR_MIN)) * 730;
                          return (
                            <g key={i}>
                              <line x1={x} y1={200} x2={x} y2={205} stroke={FG_MUTE} strokeWidth={0.5} />
                              <text x={x} y={218} fill={FG_DIM} fontSize={10} fontFamily="monospace" textAnchor="middle">{v}</text>
                            </g>
                          );
                        })}
                        <text x={50} y={15} fill={FG_DIM} fontSize={10} fontFamily="monospace">samples ↑</text>
                        <text x={780} y={234} textAnchor="end" fill={FG_DIM} fontSize={10} fontFamily="monospace">A/F →</text>
                      </svg>
                    </Panel>

                    <Panel title="RPM × A/F — engine map check" accent>
                      <svg viewBox="0 0 800 320" className="w-full" style={{ background: BG }}>
                        {(() => {
                          const rpmMax = Math.max(...scatter.map((s) => s.Rpm)) * 1.05;
                          const sx = (r) => 50 + (r / rpmMax) * 730;
                          const sy = (a) => 280 - ((a - AFR_MIN) / (AFR_MAX - AFR_MIN)) * 260;
                          return (<>
                            <rect x={50} y={sy(target.high)} width={730} height={sy(target.low) - sy(target.high)}
                              fill={ACCENT} opacity={0.08} />
                            {[8, 10, 12, 13, 14, 14.7, 16, 18, 20].map((v, i) => (
                              <g key={i}>
                                <line x1={50} y1={sy(v)} x2={780} y2={sy(v)} stroke={STROKE} strokeWidth={0.3} />
                                <text x={45} y={sy(v) + 3} textAnchor="end" fill={FG_DIM} fontSize={9} fontFamily="monospace">{v}</text>
                              </g>
                            ))}
                            {[2000, 4000, 6000, 8000, 10000, 12000].filter((v) => v <= rpmMax).map((v, i) => (
                              <g key={i}>
                                <line x1={sx(v)} y1={20} x2={sx(v)} y2={280} stroke={STROKE} strokeWidth={0.3} />
                                <text x={sx(v)} y={295} textAnchor="middle" fill={FG_DIM} fontSize={9} fontFamily="monospace">{v.toLocaleString()}</text>
                              </g>
                            ))}
                            {scatter.map((s, i) => (
                              <circle key={i} cx={sx(s.Rpm)} cy={sy(s.Afr)} r={1.4} fill={afrColor(s.Afr, activeSession.engineType)} opacity={0.65} />
                            ))}
                            <text x={50} y={15} fill={FG_DIM} fontSize={10} fontFamily="monospace">A/F ↑</text>
                            <text x={780} y={313} textAnchor="end" fill={FG_DIM} fontSize={10} fontFamily="monospace">RPM →</text>
                          </>);
                        })()}
                      </svg>
                    </Panel>

                    {activeSession.hasThrottle && (
                      <Panel title="Throttle × A/F — load mapping" accent>
                        <svg viewBox="0 0 800 320" className="w-full" style={{ background: BG }}>
                          {(() => {
                            const sx = (t) => 50 + (t / 100) * 730;
                            const sy = (a) => 280 - ((a - AFR_MIN) / (AFR_MAX - AFR_MIN)) * 260;
                            const throttled = scatter.filter((s) => s.ThrottolePos > 0);
                            return (<>
                              <rect x={50} y={sy(target.high)} width={730} height={sy(target.low) - sy(target.high)}
                                fill={ACCENT} opacity={0.08} />
                              {[8, 10, 12, 13, 14, 14.7, 16, 18, 20].map((v, i) => (
                                <g key={i}>
                                  <line x1={50} y1={sy(v)} x2={780} y2={sy(v)} stroke={STROKE} strokeWidth={0.3} />
                                  <text x={45} y={sy(v) + 3} textAnchor="end" fill={FG_DIM} fontSize={9} fontFamily="monospace">{v}</text>
                                </g>
                              ))}
                              {[0, 25, 50, 75, 100].map((v, i) => (
                                <g key={i}>
                                  <line x1={sx(v)} y1={20} x2={sx(v)} y2={280} stroke={STROKE} strokeWidth={0.3} />
                                  <text x={sx(v)} y={295} textAnchor="middle" fill={FG_DIM} fontSize={9} fontFamily="monospace">{v}%</text>
                                </g>
                              ))}
                              {throttled.map((s, i) => (
                                <circle key={i} cx={sx(s.ThrottolePos)} cy={sy(s.Afr)} r={1.4} fill={afrColor(s.Afr, activeSession.engineType)} opacity={0.65} />
                              ))}
                              <text x={50} y={15} fill={FG_DIM} fontSize={10} fontFamily="monospace">A/F ↑</text>
                              <text x={780} y={313} textAnchor="end" fill={FG_DIM} fontSize={10} fontFamily="monospace">Throttle →</text>
                            </>);
                          })()}
                        </svg>
                      </Panel>
                    )}

                    {activeSession.hasThrottle && lapWOT.length > 0 && (
                      <Panel title="Per-lap WOT (>60% throttle) average A/F — tuning consistency" accent>
                        <svg viewBox="0 0 800 240" className="w-full" style={{ background: BG }}>
                          {(() => {
                            const sx = (i) => 50 + (i / Math.max(1, lapWOT.length - 1)) * 730;
                            const sy = (a) => 200 - ((a - AFR_MIN) / (AFR_MAX - AFR_MIN)) * 180;
                            return (<>
                              <rect x={50} y={sy(target.high)} width={730} height={sy(target.low) - sy(target.high)}
                                fill={ACCENT} opacity={0.1} />
                              {[10, 12, 13, 14, 16].map((v, i) => (
                                <g key={i}>
                                  <line x1={50} y1={sy(v)} x2={780} y2={sy(v)} stroke={STROKE} strokeWidth={0.3} />
                                  <text x={45} y={sy(v) + 3} textAnchor="end" fill={FG_DIM} fontSize={9} fontFamily="monospace">{v}</text>
                                </g>
                              ))}
                              <path d={lapWOT.map((d, i) => `${i ? "L" : "M"}${sx(i)},${sy(d.avg)}`).join("")}
                                fill="none" stroke={ACCENT} strokeWidth={1} opacity={0.5} />
                              {lapWOT.map((d, i) => (
                                <g key={i}>
                                  <circle cx={sx(i)} cy={sy(d.avg)} r={4} fill={afrColor(d.avg, activeSession.engineType)} stroke={FG} strokeWidth={0.5} />
                                  <text x={sx(i)} y={220} textAnchor="middle" fill={FG_DIM} fontSize={9} fontFamily="monospace">L{d.lap}</text>
                                  <text x={sx(i)} y={sy(d.avg) - 8} textAnchor="middle" fill={FG} fontSize={9} fontFamily="monospace">{d.avg.toFixed(2)}</text>
                                </g>
                              ))}
                              <text x={50} y={15} fill={FG_DIM} fontSize={10} fontFamily="monospace">avg A/F at WOT ↑</text>
                            </>);
                          })()}
                        </svg>
                      </Panel>
                    )}
                  </>);
                })()}
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

// Hide loader and mount the app
document.getElementById('loader').style.display = 'none';
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<DroggerAnalyzer />);
  </script>

</body>
</html>
