// ─── Helpers ─────────────────────────────────────────────────────
const fmtTime = (s) => {
  if (s == null || isNaN(s)) return "—";
  const m = Math.floor(s / 60);
  const sec = (s - m * 60).toFixed(3);
  return m > 0 ? `${m}:${sec.padStart(6, "0")}` : `${parseFloat(sec).toFixed(3)}`;
};
const fmtNum = (n, d = 1) => (n == null || isNaN(n) ? "—" : n.toFixed(d));

const llToMeters = (lat, lon, lat0, lon0) => {
  const mLat = 111000;
  const mLon = 111000 * Math.cos((lat0 * Math.PI) / 180);
  return [(lon - lon0) * mLon, (lat - lat0) * mLat];
};

const newId = () => `id_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;

// ─── RPM color: fixed scale, engine-type aware ───────────────────
// 2st: ≤5,000=blue, 8,000=yellow, 14,000=red
// 4st: ≤3,000=blue, 8,000=yellow, 12,000=red
const RPM_STOPS = {
  "2st": { low: 5000, mid: 8000, high: 14000 },
  "4st": { low: 3000, mid: 8000, high: 12000 },
};
// HSL interpolation gives vivid mids (blue → cyan → green → yellow → orange → red)
const rpmColor = (rpm, engineType = "4st") => {
  const { low, mid, high } = RPM_STOPS[engineType] || RPM_STOPS["4st"];
  let h, s, l;
  if (rpm <= low)        { h = 220; s = 85; l = 50; }
  else if (rpm >= high)  { h = 0;   s = 90; l = 50; }
  else if (rpm < mid) {
    const t = (rpm - low) / (mid - low);
    h = 220 + (50 - 220) * t;
    s = 85 + (95 - 85) * t;
    l = 50 + (55 - 50) * t;
  } else {
    const t = (rpm - mid) / (high - mid);
    h = 50 + (0 - 50) * t;
    s = 95 + (90 - 95) * t;
    l = 55 + (50 - 55) * t;
  }
  return `hsl(${h.toFixed(0)},${s.toFixed(0)}%,${l.toFixed(0)}%)`;
};

// ─── AFR color: full 8.0–20.0 range, engine-type aware target band ─
// Multi-stop gradient: deep blue (rich) → cyan → green (target) → yellow → red (lean)
const AFR_TARGETS = {
  "2st": { low: 11.5, mid: 12.0, high: 12.5 },
  "4st": { low: 12.5, mid: 13.0, high: 13.5 },
};
const AFR_MIN = 8.0;
const AFR_MAX = 20.0;
// HSL interpolation between stops; gradient "warmer = leaner = more dangerous"
const afrColor = (afr, engineType = "4st") => {
  const t = AFR_TARGETS[engineType] || AFR_TARGETS["4st"];
  // Build stop array: [afrValue, h, s, l]
  const stops = [
    [AFR_MIN, 240, 80, 30],   // very rich: deep blue
    [11.0,    210, 85, 50],   // rich: blue
    [t.low,   170, 80, 50],   // approaching target: teal
    [t.mid,   135, 85, 50],   // optimal target: vivid green
    [t.high,   80, 85, 55],   // top of target: yellow-green
    [14.7,     55, 95, 55],   // stoich: yellow
    [17.0,     20, 95, 55],   // lean warning: orange
    [AFR_MAX,   0, 90, 45],   // very lean: deep red
  ];
  // Clamp to range
  if (afr <= stops[0][0]) {
    const [, h, s, l] = stops[0];
    return `hsl(${h},${s}%,${l}%)`;
  }
  if (afr >= stops[stops.length - 1][0]) {
    const [, h, s, l] = stops[stops.length - 1];
    return `hsl(${h},${s}%,${l}%)`;
  }
  for (let i = 0; i < stops.length - 1; i++) {
    const [a1, h1, s1, l1] = stops[i];
    const [a2, h2, s2, l2] = stops[i + 1];
    if (afr >= a1 && afr <= a2) {
      const k = (afr - a1) / (a2 - a1);
      const h = h1 + (h2 - h1) * k;
      const s = s1 + (s2 - s1) * k;
      const l = l1 + (l2 - l1) * k;
      return `hsl(${h.toFixed(0)},${s.toFixed(0)}%,${l.toFixed(0)}%)`;
    }
  }
  return "#888";
};

// ─── Cross-browser file text reader (file.text() needs Chrome 76+) ───
const readFileAsText = (file) => new Promise((resolve, reject) => {
  if (typeof file.text === "function") {
    file.text().then(resolve).catch(reject);
    return;
  }
  const reader = new FileReader();
  reader.onload = () => resolve(reader.result);
  reader.onerror = () => reject(reader.error || new Error("FileReader failed"));
  reader.readAsText(file);
});

// ─── Find sample at given elapsed seconds since lap start ────────
// Uses RunTime (absolute session time) to locate the sample. If the
// requested elapsed exceeds the lap's duration, returns the last sample
// (so a fast lap "parks" at the finish while a slower lap continues).
const sampleAtElapsed = (lap, elapsedSec) => {
  if (!lap || !lap.samples.length) return null;
  const t0 = lap.samples[0].RunTime;
  const tEnd = lap.samples[lap.samples.length - 1].RunTime;
  const target = t0 + Math.max(0, Math.min(tEnd - t0, elapsedSec));
  for (let i = 0; i < lap.samples.length; i++) {
    if (lap.samples[i].RunTime >= target) return lap.samples[i];
  }
  return lap.samples[lap.samples.length - 1];
};

// ─── Parse one Drogger CSV ───────────────────────────────────────
// ─── Log file format detection ───────────────────────────────────
// Returns one of: 'drogger', 'aracer_sp', 'aracer_ecu', 'aracer_lm', 'unknown'
const detectLogFormat = (text) => {
  const firstLine = text.split("\n", 1)[0].trim();
  if (firstLine.startsWith("<aRacer APP Log Data for RaceAMP>"))     return "aracer_sp";
  // ECU memory has two header variants: "Cycling Memory" (looped buffer) and plain "ECU Memory" (full export)
  if (firstLine.startsWith("<Cycling Memory Log Data of Super ECU>")) return "aracer_ecu";
  if (firstLine.startsWith("<ECU Memory Log Data of Super ECU>"))     return "aracer_ecu";
  if (firstLine.startsWith("<aRacer ECU_Memory Log Data for RaceAMP>")) return "aracer_lm";
  // Drogger CSV starts with column header line containing common field names
  if (firstLine.includes("Lap") && firstLine.includes("Rpm") && firstLine.includes("RunTime")) return "drogger";
  return "unknown";
};

// ─── aRacer .loga parser ─────────────────────────────────────────
// Returns array of records compatible with parseSession (Drogger-style fields)
// All 3 aRacer formats share the same structure:
//   L1: <type marker>
//   L2-4: metadata (date, ID, version)
//   L5: stage/flag classification (ignored)
//   L6: column headers
//   L7+: data rows
const parseAracerLog = (text, format) => {
  const lines = text.split(/\r?\n/);
  if (lines.length < 8) throw new Error("aRacer ログのデータ行が不足しています");

  const headers = lines[5].split(",");
  // Helper: find column index by matching tail of name (after last dot, before slash)
  // e.g. "Fuel.NBO2_BL_En/" → "NBO2_BL_En", "IR_LapNumber/圈數" → "IR_LapNumber"
  const normalizeHeader = (h) => {
    const beforeSlash = h.split("/")[0];
    const afterDot = beforeSlash.split(".").pop();
    return afterDot.trim().toLowerCase();
  };
  const normalizedHeaders = headers.map(normalizeHeader);
  const findIdx = (...patterns) => {
    for (const p of patterns) {
      const idx = normalizedHeaders.indexOf(p.toLowerCase());
      if (idx >= 0) return idx;
    }
    return -1;
  };

  const idx = {
    Rpm:          findIdx("rpm"),
    Speed:        findIdx("vehicle_speed_filtered", "vehicle_speed", "gps_speed"),
    Afr:          findIdx("afr_wbo2_cal", "afr"),
    ThrottolePos: findIdx("tps_percent"),
    Voltage:      findIdx("volt_batt_indx"),
    Lap:          findIdx("ir_lapnumber"),
    LapTime:      findIdx("ir_laptime"),
    LeanAngle:    findIdx("tc_lean_angle"),
    GearNum:      findIdx("gearnum"),
    GpsLatDeg:    findIdx("gps_lat_deg"),
    GpsLatMin:    findIdx("gps_lat_min"),
    GpsLatMmmm:   findIdx("gps_lat_mmmm"),
    GpsLatNS:     findIdx("gps_lat_ns"),
    GpsLonDeg:    findIdx("gps_lon_deg"),
    GpsLonMin:    findIdx("gps_lon_min"),
    GpsLonMmmm:   findIdx("gps_lon_mmmm"),
    GpsLonEW:     findIdx("gps_lon_ew"),
  };
  const hasGpsCols = idx.GpsLatDeg >= 0 && idx.GpsLatMin >= 0 && idx.GpsLatMmmm >= 0;

  // Sampling rate auto-detect: if first 100 rows imply > 12 Hz, downsample to ~10 Hz
  const probeRows = Math.min(100, lines.length - 7);
  let sampleStride = 1;
  if (probeRows > 10) {
    const t0 = parseFloat(lines[6].split(",")[0]);
    const tEnd = parseFloat(lines[6 + probeRows - 1].split(",")[0]);
    if (!isNaN(t0) && !isNaN(tEnd) && tEnd > t0) {
      const hz = (probeRows - 1) / ((tEnd - t0) / 1000);
      if (hz > 12) sampleStride = Math.max(1, Math.round(hz / 10));
    }
  }

  const data = [];
  let hasAnyGps = false;

  // Parse data rows
  for (let li = 6; li < lines.length; li += sampleStride) {
    const line = lines[li];
    if (!line || !line.length) continue;
    const parts = line.split(",");
    const tMs = parseFloat(parts[0]);
    if (isNaN(tMs)) continue;

    const num = (i) => i >= 0 && i < parts.length ? (parseFloat(parts[i]) || 0) : 0;
    const intNum = (i) => i >= 0 && i < parts.length ? (parseInt(parts[i], 10) || 0) : 0;

    let lat = 0, lon = 0;
    if (hasGpsCols) {
      const ld = num(idx.GpsLatDeg);
      if (ld > 0) {
        const lm = num(idx.GpsLatMin);
        const lmm = num(idx.GpsLatMmmm);
        lat = ld + (lm + lmm / 10000) / 60;
        const od = num(idx.GpsLonDeg);
        const om = num(idx.GpsLonMin);
        const omm = num(idx.GpsLonMmmm);
        lon = od + (om + omm / 10000) / 60;
        // NS/EW stored as ASCII codes: N=78, S=83, E=69, W=87
        const ns = intNum(idx.GpsLatNS);
        const ew = intNum(idx.GpsLonEW);
        if (ns === 83) lat = -lat; // South
        if (ew === 87) lon = -lon; // West
        // Validate: must be within Earth's coordinate range
        if (lat < -90 || lat > 90 || lon < -180 || lon > 180) {
          lat = 0; lon = 0;
        } else {
          hasAnyGps = true;
        }
      }
    }

    data.push({
      RunTime:      tMs / 1000,
      LapRunTime:   0, // computed later
      LapTime:      num(idx.LapTime),
      Lap:          intNum(idx.Lap),
      Rpm:          num(idx.Rpm),
      Speed:        num(idx.Speed),
      Afr:          num(idx.Afr),
      ThrottolePos: num(idx.ThrottolePos),
      Voltage:      num(idx.Voltage),
      GearNum:      intNum(idx.GearNum),
      LeanAngle:    num(idx.LeanAngle),
      Latitude:     lat,
      Longitude:    lon,
      Front: 0, Rear: 0, T1: 0, T2: 0, T3: 0, RearSpeed: 0, accuracy: 0,
    });
  }

  return { data, hasGps: hasAnyGps, format, sampleStride };
};

// ─── CIRCUITS DB ─────────────────────────────────────────────────
// Known S/F finish line coordinates (two GPS points defining the line segment
// the bike crosses each lap). Add circuits as needed — coordinates confirmed
// from Google Maps satellite imagery and cross-checked with actual log data.
const CIRCUITS = [
  {
    id: "tsukuba_2000",
    name: "筑波サーキット コース2000",
    finishLine: [
      { Latitude: 36.1501667, Longitude: 139.9194167 },
      { Latitude: 36.1500556, Longitude: 139.9200556 },
    ],
  },
  {
    id: "tsukuba_1000",
    name: "筑波サーキット コース1000",
    finishLine: [
      { Latitude: 36.1510833, Longitude: 139.9247778 },
      { Latitude: 36.1510000, Longitude: 139.9251389 },
    ],
  },
  {
    id: "motegi_kart_north",
    name: "モビリティリゾートもてぎ 北ショートコース",
    finishLine: [
      { Latitude: 36.5385000, Longitude: 140.2319167 },
      { Latitude: 36.5384722, Longitude: 140.2323611 },
    ],
  },
  {
    id: "motegi_road",
    name: "モビリティリゾートもてぎ ロードコース",
    finishLine: [
      { Latitude: 36.5330000, Longitude: 140.2266389 },
      { Latitude: 36.5331389, Longitude: 140.2269444 },
    ],
  },
];

// ─── Line segment intersection test (2D Cartesian) ───────────────
// Returns true when segment AB crosses segment CD.
// Tolerance ε on t/u avoids floating-point misses at endpoints.
const segmentsIntersect = (ax, ay, bx, by, cx, cy, dx, dy) => {
  const denom = (bx - ax) * (dy - cy) - (by - ay) * (dx - cx);
  if (Math.abs(denom) < 1e-9) return false; // parallel / collinear
  const t = ((cx - ax) * (dy - cy) - (cy - ay) * (dx - cx)) / denom;
  const u = ((cx - ax) * (by - ay) - (cy - ay) * (bx - ax)) / denom;
  const ε = 0.001;
  return t >= -ε && t <= 1 + ε && u >= -ε && u <= 1 + ε;
};

// ─── Circuit auto-matcher ─────────────────────────────────────────
// Computes the session's median GPS position and finds the nearest circuit
// finish-line midpoint within MATCH_DIST_M (10 km). Returns null if no match.
const matchCircuit = (validGps) => {
  if (!validGps.length) return null;
  const MATCH_DIST_M = 10000;
  const sorted = [...validGps].sort((a, b) => a.Latitude - b.Latitude);
  const medLat = sorted[Math.floor(sorted.length / 2)].Latitude;
  const cosMed = Math.cos(medLat * Math.PI / 180);
  const sortedLon = [...validGps].sort((a, b) => a.Longitude - b.Longitude);
  const medLon = sortedLon[Math.floor(sortedLon.length / 2)].Longitude;

  let best = null, bestDist = MATCH_DIST_M;
  for (const c of CIRCUITS) {
    const flLat = (c.finishLine[0].Latitude + c.finishLine[1].Latitude) / 2;
    const flLon = (c.finishLine[0].Longitude + c.finishLine[1].Longitude) / 2;
    const dist = Math.hypot(
      (medLat - flLat) * 111320,
      (medLon - flLon) * 111320 * cosMed
    );
    if (dist < bestDist) { bestDist = dist; best = c; }
  }
  return best;
};

// ─── GPS-based lap detection — history & strategy ────────────────
// v10 (current): two-pass approach:
//   Pass 1 — CIRCUITS DB matching + line-segment crossing (precise).
//             If the session's GPS median lies within 10 km of a known circuit,
//             compute true lap crossings by testing each consecutive GPS-sample
//             pair against the finish-line segment. No proximity-radius errors.
//             Validated: もてぎ北ショート LM ログで 17 laps / ベスト 52.1s 再現.
//   Pass 2 — v9 pit-out fallback (40 km/h threshold).
//             Used when circuit is not in DB or crossings < 1.
//             Validated within 15-27m of finish line on もてぎ本コース.
//
// Manual override: the user can click on the Track plot (aRacer LM only)
// to set a custom S/F position. That uses applyLapsFromGpsRef (radius method).
const detectLapsFromGps = (data) => {
  const validGps = data.filter((r) => r.Latitude !== 0 && r.Longitude !== 0);
  if (validGps.length < 50) return null;

  // ── Pass 1: CIRCUITS DB + line-segment intersection ──────────────
  const circuit = matchCircuit(validGps);
  if (circuit) {
    const lat0 = validGps[0].Latitude;
    const lon0 = validGps[0].Longitude;
    const cosMid = Math.cos(lat0 * Math.PI / 180);
    const toXY = (lat, lon) => [
      (lon - lon0) * 111320 * cosMid,
      (lat - lat0) * 111320,
    ];
    const [fx1, fy1] = toXY(circuit.finishLine[0].Latitude, circuit.finishLine[0].Longitude);
    const [fx2, fy2] = toXY(circuit.finishLine[1].Latitude, circuit.finishLine[1].Longitude);

    // Extend the finish-line segment by GATE_EXTEND_M on each side.
    // GPS positional accuracy is ~10-20 m, and racing lines vary.
    // Without extension, samples near the segment endpoints can miss intersection.
    // 20 m extension brings total gate width to ~70 m for Motegi (adequate;
    // tested: 50 m already catches all crossings without false positives).
    const GATE_EXTEND_M = 20;
    const fLen = Math.hypot(fx2 - fx1, fy2 - fy1);
    const [fux, fuy] = fLen > 0 ? [(fx2 - fx1) / fLen, (fy2 - fy1) / fLen] : [1, 0];
    const gx1 = fx1 - fux * GATE_EXTEND_M;
    const gy1 = fy1 - fuy * GATE_EXTEND_M;
    const gx2 = fx2 + fux * GATE_EXTEND_M;
    const gy2 = fy2 + fuy * GATE_EXTEND_M;

    const COOLDOWN_S = 20; // minimum seconds between consecutive lap counts
    const crossTimes = [];
    let lastCrossTime = -1e9;
    let prevR = null;

    for (const r of data) {
      if (r.Latitude === 0 || r.Longitude === 0) { prevR = null; continue; }
      if (prevR && r.RunTime - lastCrossTime > COOLDOWN_S) {
        const [px, py] = toXY(prevR.Latitude, prevR.Longitude);
        const [cx, cy] = toXY(r.Latitude, r.Longitude);
        if (segmentsIntersect(px, py, cx, cy, gx1, gy1, gx2, gy2)) {
          // Interpolate crossing time between the two samples
          crossTimes.push((prevR.RunTime + r.RunTime) / 2);
          lastCrossTime = r.RunTime;
        }
      }
      prevR = r;
    }

    if (crossTimes.length >= 1) {
      // Assign Lap numbers: samples before first crossing = lap 0, then increment
      let lapNum = 0, ci = 0;
      for (const r of data) {
        while (ci < crossTimes.length && r.RunTime >= crossTimes[ci]) {
          lapNum++;
          ci++;
        }
        r.Lap = lapNum;
      }
      // Compute LapRunTime + LapTime
      const buckets = new Map();
      for (const r of data) {
        if (!buckets.has(r.Lap)) buckets.set(r.Lap, []);
        buckets.get(r.Lap).push(r);
      }
      const sortedKeys = [...buckets.keys()].sort((a, b) => a - b);
      for (let i = 0; i < sortedKeys.length; i++) {
        const smpls = buckets.get(sortedKeys[i]);
        smpls.sort((a, b) => a.RunTime - b.RunTime);
        const t0 = smpls[0].RunTime;
        smpls.forEach((r) => { r.LapRunTime = r.RunTime - t0; });
        if (i + 1 < sortedKeys.length) {
          const nxt = buckets.get(sortedKeys[i + 1]);
          const dur = nxt[0].RunTime - t0;
          nxt.forEach((r) => { r.LapTime = dur * 1000; });
        }
      }
      // Return finish-line midpoint as lapRef (visual S/F marker)
      return {
        Latitude: (circuit.finishLine[0].Latitude + circuit.finishLine[1].Latitude) / 2,
        Longitude: (circuit.finishLine[0].Longitude + circuit.finishLine[1].Longitude) / 2,
        circuitName: circuit.name,
      };
    }
    // Circuit matched but no crossings detected (GPS gap over finish line?)
    // Fall through to Pass 2.
  }

  // ── Pass 2: v9 pit-out detection (40 km/h threshold) ─────────────
  const SLOW_T = 20, FAST_T = 40, WIN = 5;
  const smoothSpeed = new Array(data.length);
  for (let i = 0; i < data.length; i++) {
    let sum = 0, n = 0;
    for (let j = Math.max(0, i - Math.floor(WIN / 2)); j <= Math.min(data.length - 1, i + Math.floor(WIN / 2)); j++) {
      sum += data[j].Speed; n++;
    }
    smoothSpeed[i] = sum / n;
  }

  const pitOuts = [];
  let state = "unknown";
  for (let i = 0; i < data.length; i++) {
    const r = data[i];
    if (r.Latitude === 0) continue;
    const s = smoothSpeed[i];
    if (state === "unknown") {
      if (s < SLOW_T) state = "slow";
      else if (s > FAST_T) state = "fast";
    } else if (state === "slow" && s > FAST_T) {
      pitOuts.push({ Latitude: r.Latitude, Longitude: r.Longitude });
      state = "fast";
    } else if (state === "fast" && s < SLOW_T) {
      state = "slow";
    }
  }

  let ref = null;
  if (pitOuts.length > 0) {
    let sumLat = 0, sumLon = 0;
    for (const p of pitOuts) { sumLat += p.Latitude; sumLon += p.Longitude; }
    ref = { Latitude: sumLat / pitOuts.length, Longitude: sumLon / pitOuts.length };
  } else {
    // Fallback for partial-session files (e.g. cyclic-buffer "last 10 min" exports)
    const maxSpeed = validGps.reduce((m, r) => r.Speed > m ? r.Speed : m, 0);
    let threshold = maxSpeed * 0.7;
    let fastSamples = validGps.filter((r) => r.Speed > threshold);
    if (fastSamples.length < 20) { threshold = maxSpeed * 0.5; fastSamples = validGps.filter((r) => r.Speed > threshold); }
    if (fastSamples.length < 20) fastSamples = validGps;
    const GRID = 0.0001;
    const cells = new Map();
    for (const r of fastSamples) {
      const key = `${Math.round(r.Latitude / GRID)},${Math.round(r.Longitude / GRID)}`;
      cells.set(key, (cells.get(key) || 0) + 1);
    }
    if (!cells.size) return null;
    let bestKey = null, bestCount = 0;
    for (const [k, c] of cells) { if (c > bestCount) { bestCount = c; bestKey = k; } }
    const [bestLatI, bestLonI] = bestKey.split(",").map(Number);
    ref = { Latitude: bestLatI * GRID, Longitude: bestLonI * GRID };
  }

  applyLapsFromGpsRef(data, ref);
  return ref;
};

// ─── Lap detection logic, separated so it can be re-run on user override ───
const applyLapsFromGpsRef = (data, ref) => {
  if (!ref) return;
  const distM = (a, b) => {
    const dLat = (b.Latitude - a.Latitude) * 111320;
    const dLon = (b.Longitude - a.Longitude) * 111320 * Math.cos(a.Latitude * Math.PI / 180);
    return Math.hypot(dLat, dLon);
  };
  const NEAR_M = 50;
  const FAR_M = 200;
  const COOLDOWN_S = 30;

  let currentLap = 0;
  let maxFromRef = 0;
  let lastLapTime = -1e9;
  let inZonePrev = false;

  for (let i = 0; i < data.length; i++) {
    const r = data[i];
    if (r.Latitude === 0) { r.Lap = currentLap; continue; }
    const d = distM(ref, r);
    if (d > maxFromRef) maxFromRef = d;
    const inZone = d < NEAR_M;
    if (inZone && !inZonePrev && maxFromRef > FAR_M && (r.RunTime - lastLapTime) > COOLDOWN_S) {
      currentLap++;
      maxFromRef = 0;
      lastLapTime = r.RunTime;
    }
    inZonePrev = inZone;
    r.Lap = currentLap;
  }

  // LapRunTime + LapTime per Drogger semantics
  const lapBuckets = new Map();
  for (const r of data) {
    if (!lapBuckets.has(r.Lap)) lapBuckets.set(r.Lap, []);
    lapBuckets.get(r.Lap).push(r);
  }
  const sortedLaps = [...lapBuckets.keys()].sort((a, b) => a - b);
  for (let i = 0; i < sortedLaps.length; i++) {
    const samples = lapBuckets.get(sortedLaps[i]);
    samples.sort((a, b) => a.RunTime - b.RunTime);
    const lapStart = samples[0].RunTime;
    samples.forEach((r) => { r.LapRunTime = r.RunTime - lapStart; });
    if (i + 1 < sortedLaps.length) {
      const nextSamples = lapBuckets.get(sortedLaps[i + 1]);
      const dur = nextSamples[0].RunTime - lapStart;
      nextSamples.forEach((r) => { r.LapTime = dur * 1000; });
    }
  }
};

const parseSession = (rawData, name, type, options = {}) => {
  const { source = "drogger", hasGps = true, lapRef = null } = options;
  const lapMap = new Map();
  rawData.forEach((row) => {
    const lap = row.Lap;
    if (!lapMap.has(lap)) lapMap.set(lap, { lap, samples: [] });
    lapMap.get(lap).samples.push(row);
  });

  const lapsRaw = [];
  for (const [lap, e] of lapMap.entries()) {
    if (lap < 0) continue;
    const samples = e.samples;
    lapsRaw.push({ lap, samples });
  }
  lapsRaw.sort((a, b) => a.samples[0].RunTime - b.samples[0].RunTime);

  const laps = [];
  for (let i = 0; i < lapsRaw.length; i++) {
    const { lap, samples } = lapsRaw[i];
    // The official lap time for Lap N is stored in Lap N+1's LapTime column
    // (Drogger writes the just-finished lap time into the next lap's samples).
    // NOTE: This convention is Drogger-ONLY. aRacer IR_LapTime uses an
    // undocumented internal tick unit (~2.0e7 for a 90s lap, non-constant rate)
    // and must NEVER be interpreted as milliseconds (found 2026-07-11, first
    // file with a live IR lap system). aRacer sources always use RunTime delta.
    let dur;
    const next = lapsRaw[i + 1];
    const isDroggerSource = source === "drogger";
    if (isDroggerSource && next && next.samples[0].LapTime && next.samples[0].LapTime > 0) {
      dur = next.samples[0].LapTime / 1000;
    } else {
      dur = samples[samples.length - 1].RunTime - samples[0].RunTime;
    }
    const speeds = samples.map((s) => s.Speed).filter((s) => s > 0);
    const rpms = samples.map((s) => s.Rpm).filter((s) => s > 0);
    const movingSpeeds = samples.map((s) => s.Speed).filter((s) => s > 5);
    laps.push({
      lap, duration: dur,
      startTime: samples[0].RunTime,
      endTime: samples[samples.length - 1].RunTime,
      maxRpm: rpms.length ? Math.max(...rpms) : 0,
      maxSpeed: speeds.length ? Math.max(...speeds) : 0,
      avgSpeed: movingSpeeds.length ? movingSpeeds.reduce((a, b) => a + b, 0) / movingSpeeds.length : 0,
      samples,
    });
  }
  laps.sort((a, b) => a.startTime - b.startTime);

  const validGps = rawData.filter((r) => r.Latitude > 0 && r.Longitude > 0);
  const lat0 = validGps.length ? validGps.reduce((a, r) => a + r.Latitude, 0) / validGps.length : 0;
  const lon0 = validGps.length ? validGps.reduce((a, r) => a + r.Longitude, 0) / validGps.length : 0;

  // Auto-adaptive racing-lap detection: use median lap time of "plausible"
  // laps (10-600s absolute bounds), then keep laps within 0.55x..1.7x of median.
  // This adapts to short kart courses (~40s) and longer circuits (~110s) alike.
  const plausibleDurations = laps.map((l) => l.duration).filter((d) => d > 10 && d < 600);
  const medianDur = plausibleDurations.length
    ? [...plausibleDurations].sort((a, b) => a - b)[Math.floor(plausibleDurations.length / 2)]
    : 0;
  const racingMin = medianDur > 0 ? medianDur * 0.55 : 10;
  const racingMax = medianDur > 0 ? medianDur * 1.7 : 600;
  laps.forEach((l) => { l.isRacing = l.duration >= racingMin && l.duration <= racingMax; });

  let stints = [];
  let cur = null;
  laps.forEach((lap) => {
    if (!lap.isRacing) {
      if (cur) { stints.push(cur); cur = null; }
      return;
    }
    if (!cur) cur = { id: newId(), startLap: lap.lap, endLap: lap.lap, laps: [lap] };
    else { cur.endLap = lap.lap; cur.laps.push(lap); }
  });
  if (cur) stints.push(cur);

  return {
    id: newId(), name, type, engineType: "4st", laps, stints, medianLap: medianDur, lat0, lon0,
    source,
    hasGps: hasGps && rawData.some((r) => r.Latitude !== 0 && r.Longitude !== 0),
    // lapRef is ONLY set when GPS-based lap detection was performed (aRacer LM).
    // For Drogger / aRacer SP / aRacer ECU where lap data comes from the device,
    // lapRef stays null — so the S/F edit UI is hidden.
    lapRef,
    totalSamples: rawData.length,
    hasAfr: rawData.some((r) => r.Afr && r.Afr > 0),
    hasThrottle: rawData.some((r) => r.ThrottolePos && r.ThrottolePos > 0),
    hasGear: rawData.some((r) => r.GearNum && r.GearNum > 0),
    hasLeanAngle: rawData.some((r) => r.LeanAngle && Math.abs(r.LeanAngle) > 0.1),
    duration: rawData[rawData.length - 1].RunTime - rawData[0].RunTime,
  };
};

// ─── Recompute laps with a manually-specified reference point ───────
// Used when the user clicks on the Track plot to override auto-detection.
// Preserves session id / engineType so UI state (selected lap, stint
// assignments, etc.) remains valid.
const recomputeLapsForSession = (session, newRef) => {
  // Flatten all samples back into a single array, sort by RunTime
  const allSamples = session.laps.flatMap((l) => l.samples);
  allSamples.sort((a, b) => a.RunTime - b.RunTime);
  // Re-assign Lap field based on new reference
  applyLapsFromGpsRef(allSamples, newRef);
  // Re-build session structure
  const next = parseSession(allSamples, session.name, session.type, {
    source: session.source,
    hasGps: session.hasGps,
    lapRef: newRef,
  });
  // Preserve persistent identifiers
  next.id = session.id;
  next.engineType = session.engineType;
  return next;
};

// ─── Lap statistics helpers ───────────────────────────────────────
// computeLapStats: aggregate per-lap metrics from sample data
// findBests: identify the best value per column for green highlighting
//   - duration: lowest wins (faster lap)
//   - others: highest wins (more peak performance)
// Per racing convention, BEST values are shown in GREEN.
const computeLapStats = (lap, hasAfr, hasThrottle) => {
  const samples = lap.samples;
  if (!samples || samples.length === 0) return { lap: lap.lap, duration: lap.duration };

  let maxSpeed = 0, sumSpeed = 0, speedN = 0;
  let maxRpm = 0, sumRpm = 0, rpmN = 0;
  let wotN = 0, tpsN = 0;
  const afrValues = [];

  for (const s of samples) {
    if (s.Speed > 0) {
      if (s.Speed > maxSpeed) maxSpeed = s.Speed;
      sumSpeed += s.Speed; speedN++;
    }
    if (s.Rpm > 0) {
      if (s.Rpm > maxRpm) maxRpm = s.Rpm;
      sumRpm += s.Rpm; rpmN++;
    }
    if (hasAfr && s.Afr > 5 && s.Afr < 25) {
      afrValues.push(s.Afr);
    }
    if (hasThrottle && s.ThrottolePos !== undefined) {
      tpsN++;
      if (s.ThrottolePos > 90) wotN++;
    }
  }
  afrValues.sort((a, b) => a - b);

  return {
    lap:        lap.lap,
    duration:   lap.duration,
    maxSpeed:   speedN > 0 ? maxSpeed : null,
    avgSpeed:   speedN > 0 ? sumSpeed / speedN : null,
    maxRpm:     rpmN > 0 ? maxRpm : null,
    avgRpm:     rpmN > 0 ? sumRpm / rpmN : null,
    afrMedian:  afrValues.length > 0 ? afrValues[Math.floor(afrValues.length / 2)] : null,
    wotPercent: tpsN > 0 ? (wotN / tpsN * 100) : null,
    samples:    samples.length,
  };
};

const findLapBests = (allStats) => {
  const bests = {};
  // Lower is better
  for (const key of ["duration"]) {
    const vals = allStats.map((s) => s[key]).filter((v) => v != null && !isNaN(v));
    if (vals.length) bests[key] = Math.min(...vals);
  }
  // Higher is better
  for (const key of ["maxSpeed", "avgSpeed", "maxRpm", "wotPercent"]) {
    const vals = allStats.map((s) => s[key]).filter((v) => v != null && !isNaN(v));
    if (vals.length) bests[key] = Math.max(...vals);
  }
  return bests;
};

// Format a delta in M:SS.fff or +S.fff format
const fmtDelta = (sec) => {
  if (sec == null || isNaN(sec)) return "—";
  if (sec === 0) return "—";
  const sign = sec > 0 ? "+" : "−";
  const abs = Math.abs(sec);
  if (abs >= 60) {
    const m = Math.floor(abs / 60);
    const s = (abs % 60).toFixed(3).padStart(6, "0");
    return `${sign}${m}:${s}`;
  }
  return `${sign}${abs.toFixed(3)}`;
};

const BEST_GREEN = "#22c55e";

// ─── Lap statistics table ─────────────────────────────────────────
// Tabular view showing per-lap metrics with best-value highlighting.
// Per racing convention, BEST values are GREEN. Currently selected lap
// row gets the standard yellow accent highlight (consistent with chips).
const LapTable = ({ laps, selectedLap, onSelectLap, hasAfr, hasThrottle, lookupRiderForLap, isMobile }) => {
  const stats = React.useMemo(
    () => laps.map((l) => computeLapStats(l, hasAfr, hasThrottle)),
    [laps, hasAfr, hasThrottle]
  );
  const bests = React.useMemo(() => findLapBests(stats), [stats]);

  // Show RPM column only if any lap has meaningful RPM data
  const showRpm = stats.some((s) => s.maxRpm != null && s.maxRpm > 0);

  const cellClass = (key, val) => {
    if (val == null) return "text-gray-600";
    if (bests[key] != null && val === bests[key]) return "font-bold";
    return "text-gray-200";
  };
  const cellColor = (key, val) => {
    if (val == null) return null;
    if (bests[key] != null && val === bests[key]) return BEST_GREEN;
    return null;
  };

  const headerCellStyle = {
    background: PANEL_2,
    color: FG_MUTE,
    borderBottom: `1px solid ${STROKE}`,
    padding: isMobile ? "8px 6px" : "6px 8px",
    fontSize: isMobile ? 10 : 9,
    fontFamily: "monospace",
    textTransform: "uppercase",
    letterSpacing: "0.1em",
    fontWeight: 500,
    whiteSpace: "nowrap",
  };
  const cellStyle = {
    padding: isMobile ? "8px 6px" : "5px 8px",
    fontSize: isMobile ? 11 : 10,
    fontFamily: "monospace",
    fontVariantNumeric: "tabular-nums",
    whiteSpace: "nowrap",
  };

  return (
    <div className="overflow-x-auto overflow-y-auto" style={{ maxHeight: isMobile ? 360 : 320 }}>
      <table style={{ width: "100%", borderCollapse: "collapse" }}>
        <thead style={{ position: "sticky", top: 0, zIndex: 1 }}>
          <tr>
            <th style={{ ...headerCellStyle, textAlign: "left", position: "sticky", left: 0, zIndex: 2 }}>Lap</th>
            <th style={{ ...headerCellStyle, textAlign: "right" }}>Time</th>
            <th style={{ ...headerCellStyle, textAlign: "right" }}>Δ Best</th>
            <th style={{ ...headerCellStyle, textAlign: "right" }}>Max km/h</th>
            <th style={{ ...headerCellStyle, textAlign: "right" }}>Avg km/h</th>
            {showRpm && <th style={{ ...headerCellStyle, textAlign: "right" }}>Max RPM</th>}
            {hasAfr     && <th style={{ ...headerCellStyle, textAlign: "right" }}>A/F med</th>}
            {hasThrottle && <th style={{ ...headerCellStyle, textAlign: "right" }}>WOT%</th>}
          </tr>
        </thead>
        <tbody>
          {stats.map((s) => {
            const r = lookupRiderForLap(s.lap);
            const isSelected = selectedLap === s.lap;
            const isBest = bests.duration != null && s.duration === bests.duration;
            const delta = bests.duration != null ? s.duration - bests.duration : null;
            const rowBg = isSelected ? "rgba(250,204,21,0.12)" : "transparent";

            return (
              <tr key={s.lap}
                  onClick={() => onSelectLap(s.lap)}
                  className="cursor-pointer"
                  style={{
                    background: rowBg,
                    borderBottom: `1px solid ${STROKE}`,
                    borderLeft: isSelected ? `2px solid ${ACCENT}` : "2px solid transparent",
                  }}
                  onMouseEnter={(e) => { if (!isSelected) e.currentTarget.style.background = "rgba(255,255,255,0.03)"; }}
                  onMouseLeave={(e) => { e.currentTarget.style.background = rowBg; }}>
                <td style={{ ...cellStyle, position: "sticky", left: 0, background: isSelected ? "#1f2533" : PANEL, color: isSelected ? ACCENT : FG, fontWeight: isSelected ? 700 : 500, zIndex: 1 }}>
                  <span className="inline-flex items-center gap-1.5">
                    {r && <span className="w-1.5 h-1.5" style={{ background: r.color, display: "inline-block" }}></span>}
                    {isBest && <span style={{ color: BEST_GREEN }}>★</span>}
                    L{s.lap}
                  </span>
                </td>
                <td style={{ ...cellStyle, textAlign: "right", color: cellColor("duration", s.duration) || FG }} className={cellClass("duration", s.duration)}>
                  {fmtTime(s.duration)}
                </td>
                <td style={{ ...cellStyle, textAlign: "right", color: isBest ? BEST_GREEN : FG_MUTE, fontWeight: isBest ? 700 : 400 }}>
                  {delta == null ? "—" : isBest ? "BEST" : `+${delta.toFixed(3)}`}
                </td>
                <td style={{ ...cellStyle, textAlign: "right", color: cellColor("maxSpeed", s.maxSpeed) || FG }} className={cellClass("maxSpeed", s.maxSpeed)}>
                  {s.maxSpeed != null ? s.maxSpeed.toFixed(1) : "—"}
                </td>
                <td style={{ ...cellStyle, textAlign: "right", color: cellColor("avgSpeed", s.avgSpeed) || FG }} className={cellClass("avgSpeed", s.avgSpeed)}>
                  {s.avgSpeed != null ? s.avgSpeed.toFixed(1) : "—"}
                </td>
                {showRpm && (
                  <td style={{ ...cellStyle, textAlign: "right", color: cellColor("maxRpm", s.maxRpm) || FG }} className={cellClass("maxRpm", s.maxRpm)}>
                    {s.maxRpm != null ? s.maxRpm.toFixed(0) : "—"}
                  </td>
                )}
                {hasAfr && (
                  <td style={{ ...cellStyle, textAlign: "right", color: FG }}>
                    {s.afrMedian != null ? s.afrMedian.toFixed(2) : "—"}
                  </td>
                )}
                {hasThrottle && (
                  <td style={{ ...cellStyle, textAlign: "right", color: cellColor("wotPercent", s.wotPercent) || FG }} className={cellClass("wotPercent", s.wotPercent)}>
                    {s.wotPercent != null ? s.wotPercent.toFixed(0) + "%" : "—"}
                  </td>
                )}
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
};
