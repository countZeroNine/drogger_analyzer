// ─── GPS track plot ──────────────────────────────────────────────
const TrackPlot = ({ lap, lat0, lon0, colorBy = "speed", engineType = "4st", overlay = null, cursorSample = null, overlayCursorSample = null, height = 380, lapRef = null, lapLineEditMode = false, onSetLapLine = null }) => {
  if (!lap || !lap.samples.length) return null;
  const pts = lap.samples.filter((s) => s.Latitude > 0 && s.Longitude > 0)
    .map((s) => { const [x, y] = llToMeters(s.Latitude, s.Longitude, lat0, lon0);
                  return { x, y, speed: s.Speed, rpm: s.Rpm, afr: s.Afr, t: s.LapRunTime }; });
  if (!pts.length) return null;

  const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
  let xmin = Math.min(...xs), xmax = Math.max(...xs);
  let ymin = Math.min(...ys), ymax = Math.max(...ys);
  if (overlay) {
    overlay.samples.filter((s) => s.Latitude > 0 && s.Longitude > 0).forEach((s) => {
      const [x, y] = llToMeters(s.Latitude, s.Longitude, lat0, lon0);
      xmin = Math.min(xmin, x); xmax = Math.max(xmax, x);
      ymin = Math.min(ymin, y); ymax = Math.max(ymax, y);
    });
  }
  const pad = 30, w = 800, h = height;
  const dx = xmax - xmin || 1, dy = ymax - ymin || 1;
  const sx = (w - 2 * pad) / dx, sy = (h - 2 * pad) / dy;
  const sc = Math.min(sx, sy);
  const ox = pad + ((w - 2 * pad) - dx * sc) / 2 - xmin * sc;
  const oy = h - (pad + ((h - 2 * pad) - dy * sc) / 2 - ymin * sc);
  const proj = (x, y) => [x * sc + ox, oy - y * sc];

  const speeds = pts.map((p) => p.speed); const sMin = Math.min(...speeds), sMax = Math.max(...speeds);
  const colorFor = (val) => {
    if (colorBy === "rpm") return rpmColor(val, engineType);
    if (colorBy === "afr") return afrColor(val, engineType);
    const t = (val - sMin) / (sMax - sMin || 1); return `hsl(${280 - t * 280}, 85%, ${30 + t * 30}%)`;
  };

  // Build legend for RPM mode based on the engine stops
  const rpmStops = RPM_STOPS[engineType] || RPM_STOPS["4st"];
  const afrTarget = AFR_TARGETS[engineType] || AFR_TARGETS["4st"];

  const colorByValue = (p) => {
    if (colorBy === "rpm") return p.rpm;
    if (colorBy === "afr") return p.afr;
    return p.speed;
  };

  // Convert SVG click position back to lat/lon (inverse of proj + llToMeters)
  const handleSvgClick = (e) => {
    if (!lapLineEditMode || !onSetLapLine) return;
    const svg = e.currentTarget;
    const rect = svg.getBoundingClientRect();
    // Map client (px) to SVG viewBox coords
    const px = ((e.clientX - rect.left) / rect.width) * w;
    const py = ((e.clientY - rect.top) / rect.height) * h;
    // Invert proj: [px, py] = [x*sc+ox, oy-y*sc] → x = (px-ox)/sc, y = (oy-py)/sc
    const xMeters = (px - ox) / sc;
    const yMeters = (oy - py) / sc;
    // Invert llToMeters
    const newLat = lat0 + yMeters / 111320;
    const newLon = lon0 + xMeters / (111320 * Math.cos(lat0 * Math.PI / 180));
    onSetLapLine(newLat, newLon);
  };

  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{ background: BG, cursor: lapLineEditMode ? "crosshair" : "default" }}
         onClick={handleSvgClick}>
      {[...Array(8)].map((_, i) => (<line key={`vx${i}`} x1={(i * w) / 8} y1={0} x2={(i * w) / 8} y2={h} stroke={STROKE} strokeWidth={0.5} opacity={0.5} />))}
      {[...Array(5)].map((_, i) => (<line key={`vy${i}`} x1={0} y1={(i * h) / 5} x2={w} y2={(i * h) / 5} stroke={STROKE} strokeWidth={0.5} opacity={0.5} />))}
      {lapLineEditMode && (
        <text x={w / 2} y={20} textAnchor="middle" fill="#facc15" fontSize={11} fontFamily="monospace" fontWeight="bold"
              style={{ paintOrder: "stroke", stroke: "#000000", strokeWidth: 3 }}>
          ▼ クリックでスタートフィニッシュラインを設定
        </text>
      )}
      {overlay && overlay.samples.filter((s) => s.Latitude > 0 && s.Longitude > 0).map((s, i) => {
        const [x, y] = llToMeters(s.Latitude, s.Longitude, lat0, lon0);
        const [px, py] = proj(x, y);
        return <circle key={`o${i}`} cx={px} cy={py} r={1.4} fill={FG_MUTE} opacity={0.35} />;
      })}
      {pts.map((p, i) => { const [px, py] = proj(p.x, p.y);
        return <circle key={i} cx={px} cy={py} r={2} fill={colorFor(colorByValue(p))} />; })}
      {(() => {
        const [sx0, sy0] = proj(pts[0].x, pts[0].y);
        const [ex, ey] = proj(pts[pts.length - 1].x, pts[pts.length - 1].y);
        return (<>
          <circle cx={sx0} cy={sy0} r={6} fill="none" stroke="#22d3ee" strokeWidth={2} />
          <circle cx={ex} cy={ey} r={6} fill="none" stroke={ACCENT} strokeWidth={2} />
          <text x={sx0 + 10} y={sy0 + 4} fill="#22d3ee" fontSize={9} fontFamily="monospace">START</text>
          <text x={ex + 10} y={ey + 4} fill={ACCENT} fontSize={9} fontFamily="monospace">END</text>
        </>);
      })()}
      {/* Animation cursor for compare lap (overlay, cyan) - draw under main */}
      {overlayCursorSample && overlayCursorSample.Latitude > 0 && (() => {
        const [x, y] = llToMeters(overlayCursorSample.Latitude, overlayCursorSample.Longitude, lat0, lon0);
        const [px, py] = proj(x, y);
        return (
          <g>
            <circle cx={px} cy={py} r={12} fill="none" stroke="#22d3ee" strokeWidth={1.5} opacity={0.4} />
            <circle cx={px} cy={py} r={6} fill="#22d3ee" stroke="#0a0e14" strokeWidth={1.5} />
          </g>
        );
      })()}
      {/* Lap reference marker (S/F line position auto-detected) */}
      {lapRef && lapRef.Latitude && (() => {
        const [x, y] = llToMeters(lapRef.Latitude, lapRef.Longitude, lat0, lon0);
        const [px, py] = proj(x, y);
        // 50m detection radius circle (matches NEAR_M in detector)
        const rPx = 50 * sc;
        return (
          <g>
            {/* Detection radius (faint) */}
            <circle cx={px} cy={py} r={rPx} fill="none" stroke="#ffffff" strokeWidth={0.8} strokeDasharray="3,3" opacity={0.35} />
            {/* Center marker — checkered flag look (4-square pattern) */}
            <rect x={px - 6} y={py - 6} width={6} height={6} fill="#ffffff" />
            <rect x={px}     y={py - 6} width={6} height={6} fill="#000000" />
            <rect x={px - 6} y={py}     width={6} height={6} fill="#000000" />
            <rect x={px}     y={py}     width={6} height={6} fill="#ffffff" />
            <rect x={px - 6} y={py - 6} width={12} height={12} fill="none" stroke="#ffffff" strokeWidth={1} />
            <text x={px + 10} y={py - 6} fill="#ffffff" fontSize={10} fontFamily="monospace" fontWeight="bold"
                  style={{ paintOrder: "stroke", stroke: "#000000", strokeWidth: 2.5 }}>
              S/F
            </text>
          </g>
        );
      })()}
      {/* Animation cursor for main lap (yellow) */}
      {cursorSample && cursorSample.Latitude > 0 && (() => {
        const [x, y] = llToMeters(cursorSample.Latitude, cursorSample.Longitude, lat0, lon0);
        const [px, py] = proj(x, y);
        return (
          <g>
            <circle cx={px} cy={py} r={14} fill="none" stroke={ACCENT} strokeWidth={1.5} opacity={0.5} />
            <circle cx={px} cy={py} r={7} fill={ACCENT} stroke="#0a0e14" strokeWidth={1.5} />
          </g>
        );
      })()}
      {colorBy === "rpm" ? (
        <g transform={`translate(${w - 200}, 20)`}>
          <text x={0} y={-5} fill={FG_MUTE} fontSize={9} fontFamily="monospace">RPM · {engineType.toUpperCase()}</text>
          {[...Array(40)].map((_, i) => {
            const t = i / 39;
            const r = rpmStops.low + t * (rpmStops.high - rpmStops.low);
            return <rect key={i} x={i * 4.5} y={0} width={4.6} height={6} fill={rpmColor(r, engineType)} />;
          })}
          <line x1={((rpmStops.mid - rpmStops.low) / (rpmStops.high - rpmStops.low)) * 180} y1={-2} x2={((rpmStops.mid - rpmStops.low) / (rpmStops.high - rpmStops.low)) * 180} y2={8} stroke={FG} strokeWidth={0.5} />
          <text x={0} y={20} fill={FG_DIM} fontSize={9} fontFamily="monospace">{rpmStops.low.toLocaleString()}</text>
          <text x={((rpmStops.mid - rpmStops.low) / (rpmStops.high - rpmStops.low)) * 180} y={20} textAnchor="middle" fill={FG_DIM} fontSize={9} fontFamily="monospace">{rpmStops.mid.toLocaleString()}</text>
          <text x={180} y={20} textAnchor="end" fill={FG_DIM} fontSize={9} fontFamily="monospace">{rpmStops.high.toLocaleString()}</text>
        </g>
      ) : colorBy === "afr" ? (
        <g transform={`translate(${w - 220}, 20)`}>
          <text x={0} y={-5} fill={FG_MUTE} fontSize={9} fontFamily="monospace">A/F · {engineType.toUpperCase()} · target {afrTarget.mid}</text>
          {[...Array(60)].map((_, i) => {
            const t = i / 59;
            const a = AFR_MIN + t * (AFR_MAX - AFR_MIN);
            return <rect key={i} x={i * 3.3} y={0} width={3.4} height={6} fill={afrColor(a, engineType)} />;
          })}
          {/* Tick marks for target band */}
          {[afrTarget.low, afrTarget.mid, afrTarget.high].map((v, i) => {
            const x = ((v - AFR_MIN) / (AFR_MAX - AFR_MIN)) * 198;
            return <line key={i} x1={x} y1={-2} x2={x} y2={8} stroke={FG} strokeWidth={i === 1 ? 1 : 0.5} />;
          })}
          <text x={0} y={20} fill={FG_DIM} fontSize={9} fontFamily="monospace">{AFR_MIN.toFixed(1)}</text>
          <text x={((afrTarget.mid - AFR_MIN) / (AFR_MAX - AFR_MIN)) * 198} y={20} textAnchor="middle" fill={ACCENT} fontSize={9} fontFamily="monospace">{afrTarget.mid.toFixed(1)}</text>
          <text x={198} y={20} textAnchor="end" fill={FG_DIM} fontSize={9} fontFamily="monospace">{AFR_MAX.toFixed(1)}</text>
        </g>
      ) : (
        <g transform={`translate(${w - 130}, 20)`}>
          <text x={0} y={-5} fill={FG_MUTE} fontSize={9} fontFamily="monospace">SPEED km/h</text>
          {[0, 0.25, 0.5, 0.75, 1].map((t, i) => (
            <rect key={i} x={i * 24} y={0} width={24} height={6} fill={`hsl(${280 - t * 280}, 85%, ${30 + t * 30}%)`} />
          ))}
          <text x={0} y={20} fill={FG_DIM} fontSize={9} fontFamily="monospace">{fmtNum(sMin, 0)}</text>
          <text x={120} y={20} textAnchor="end" fill={FG_DIM} fontSize={9} fontFamily="monospace">{fmtNum(sMax, 0)}</text>
        </g>
      )}
    </svg>
  );
};

const TracePlot = ({ lapA, lapB, mode = "speed", height = 280, label, cursorSampleA = null, cursorSampleB = null }) => {
  if (!lapA) return null;
  const w = 800, h = height, pad = { l: 50, r: 20, t: 20, b: 30 };
  const distOf = (lap) => {
    let d = 0; let lastLat = null, lastLon = null;
    const lat0Lap = lap.samples.find((s) => s.Latitude > 0)?.Latitude || 0;
    const lon0Lap = lap.samples.find((s) => s.Longitude > 0)?.Longitude || 0;
    return lap.samples.map((s) => {
      if (s.Latitude > 0) {
        if (lastLat !== null) {
          const [x, y] = llToMeters(s.Latitude, s.Longitude, lat0Lap, lon0Lap);
          const [lx, ly] = llToMeters(lastLat, lastLon, lat0Lap, lon0Lap);
          d += Math.hypot(x - lx, y - ly);
        }
        lastLat = s.Latitude; lastLon = s.Longitude;
      }
      return { d, v: mode === "speed" ? s.Speed : s.Rpm, t: s.LapRunTime, runTime: s.RunTime };
    });
  };
  const a = distOf(lapA);
  const b = lapB ? distOf(lapB) : null;
  const allD = [...a.map((p) => p.d), ...(b ? b.map((p) => p.d) : [])];
  const allV = [...a.map((p) => p.v), ...(b ? b.map((p) => p.v) : [])];
  const dMax = Math.max(...allD), dMin = 0;
  const vMin = mode === "speed" ? 0 : Math.max(0, Math.min(...allV) - 500);
  const vMax = Math.max(...allV) * 1.05;
  const sx = (d) => pad.l + ((d - dMin) / (dMax - dMin)) * (w - pad.l - pad.r);
  const sy = (v) => h - pad.b - ((v - vMin) / (vMax - vMin)) * (h - pad.t - pad.b);
  const pathOf = (arr) => arr.map((p, i) => `${i ? "L" : "M"}${sx(p.d).toFixed(1)},${sy(p.v).toFixed(1)}`).join("");
  const yTicks = mode === "speed" ? [0, 25, 50, 75, 100] : [0, 5000, 10000, 15000];

  // Find distance for cursor: locate sample by RunTime match in our distOf array
  const cursorDistFor = (lap, sampleArr, cursorSample) => {
    if (!cursorSample) return null;
    const idx = lap.samples.indexOf(cursorSample);
    if (idx < 0 || idx >= sampleArr.length) return null;
    return sampleArr[idx];
  };
  const cursorA = cursorDistFor(lapA, a, cursorSampleA);
  const cursorB = lapB ? cursorDistFor(lapB, b, cursorSampleB) : null;

  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{ background: BG }}>
      {yTicks.map((v) => v >= vMin && v <= vMax ? (
        <g key={v}>
          <line x1={pad.l} y1={sy(v)} x2={w - pad.r} y2={sy(v)} stroke={STROKE} strokeWidth={0.5} />
          <text x={pad.l - 6} y={sy(v) + 3} fill={FG_MUTE} fontSize={9} fontFamily="monospace" textAnchor="end">{v}</text>
        </g>) : null)}
      {[0, 0.25, 0.5, 0.75, 1].map((t, i) => (
        <text key={i} x={pad.l + t * (w - pad.l - pad.r)} y={h - pad.b + 14} fill={FG_MUTE} fontSize={9} fontFamily="monospace" textAnchor="middle">{(t * dMax).toFixed(0)}m</text>
      ))}
      {b && <path d={pathOf(b)} fill="none" stroke="#22d3ee" strokeWidth={1.3} opacity={0.85} />}
      <path d={pathOf(a)} fill="none" stroke={ACCENT} strokeWidth={1.5} />
      {/* Cursor: vertical line + dot at current sample */}
      {cursorB && (
        <g>
          <line x1={sx(cursorB.d)} y1={pad.t} x2={sx(cursorB.d)} y2={h - pad.b} stroke="#22d3ee" strokeWidth={0.6} opacity={0.5} />
          <circle cx={sx(cursorB.d)} cy={sy(cursorB.v)} r={4} fill="#22d3ee" stroke="#0a0e14" strokeWidth={1} />
        </g>
      )}
      {cursorA && (
        <g>
          <line x1={sx(cursorA.d)} y1={pad.t} x2={sx(cursorA.d)} y2={h - pad.b} stroke={ACCENT} strokeWidth={0.8} opacity={0.7} />
          <circle cx={sx(cursorA.d)} cy={sy(cursorA.v)} r={4.5} fill={ACCENT} stroke="#0a0e14" strokeWidth={1} />
          <text x={sx(cursorA.d) + 6} y={pad.t + 10} fill={ACCENT} fontSize={9} fontFamily="monospace">
            {cursorA.d.toFixed(0)}m
          </text>
        </g>
      )}
      {label && <text x={pad.l + 6} y={pad.t + 12} fill={FG_DIM} fontSize={10} fontFamily="monospace">{label}</text>}
    </svg>
  );
};

// ─── Multi-metric trace plot (Speed + RPM + A/F + TPS unified) ────────
// Drogger-style: shared distance axis, metrics overlaid with their own scales,
// color-coded. Reference lap solid, compare lap dashed.
const MULTI_METRICS = [
  { key: "Speed",        short: "SPD", label: "km/h", color: "#facc15", fmt: (v) => v.toFixed(1) },
  { key: "Rpm",          short: "RPM", label: "rpm",  color: "#22d3ee", fmt: (v) => v.toFixed(0) },
  { key: "Afr",          short: "A/F", label: "",     color: "#84cc16", fmt: (v) => v.toFixed(2) },
  { key: "ThrottolePos", short: "TPS", label: "%",    color: "#f97316", fmt: (v) => v.toFixed(0) },
];

const MultiTracePlot = ({ lapA, lapB = null, cursorSampleA = null, cursorSampleB = null, hasAfr = false, hasThrottle = false, height = 360, isMobile = false }) => {
  if (!lapA) return null;
  const w = 800, h = height, pad = { l: 12, r: 12, t: 38, b: 28 };

  const distOf = (lap) => {
    let d = 0; let lastLat = null, lastLon = null;
    const lat0Lap = lap.samples.find((s) => s.Latitude > 0)?.Latitude || 0;
    const lon0Lap = lap.samples.find((s) => s.Longitude > 0)?.Longitude || 0;
    return lap.samples.map((s) => {
      if (s.Latitude > 0) {
        if (lastLat !== null) {
          const [x, y] = llToMeters(s.Latitude, s.Longitude, lat0Lap, lon0Lap);
          const [lx, ly] = llToMeters(lastLat, lastLon, lat0Lap, lon0Lap);
          d += Math.hypot(x - lx, y - ly);
        }
        lastLat = s.Latitude; lastLon = s.Longitude;
      }
      return { d, Speed: s.Speed, Rpm: s.Rpm, Afr: s.Afr, ThrottolePos: s.ThrottolePos ?? 0 };
    });
  };

  const a = distOf(lapA);
  const b = lapB ? distOf(lapB) : null;
  const allD = [...a.map((p) => p.d), ...(b ? b.map((p) => p.d) : [])];
  const dMax = Math.max(...allD) || 1;
  const sx = (d) => pad.l + (d / dMax) * (w - pad.l - pad.r);

  const metrics = MULTI_METRICS.filter((m) => {
    if (m.key === "Afr")          return hasAfr;
    if (m.key === "ThrottolePos") return hasThrottle;
    return true;
  });
  const scales = metrics.map((m) => {
    let min, max;
    if (m.key === "Afr") { min = AFR_MIN; max = AFR_MAX; }
    else if (m.key === "ThrottolePos") { min = 0; max = 100; } // TPS always 0-100%
    else if (m.key === "Speed") {
      const allVals = [...a.map((p) => p.Speed), ...(b ? b.map((p) => p.Speed) : [])];
      min = 0; max = Math.max(Math.max(...allVals) * 1.05, 50);
    } else { // Rpm
      const allVals = [...a.map((p) => p.Rpm), ...(b ? b.map((p) => p.Rpm) : [])];
      min = 0; max = Math.max(Math.max(...allVals) * 1.05, 5000);
    }
    return { ...m, min, max };
  });

  const syFor = (val, scale) => h - pad.b - ((val - scale.min) / (scale.max - scale.min)) * (h - pad.t - pad.b);
  const pathOf = (arr, scale) =>
    arr.map((p, i) => `${i ? "L" : "M"}${sx(p.d).toFixed(1)},${syFor(p[scale.key], scale).toFixed(1)}`).join("");

  const cursorAt = (lap, sampleArr, cursorSample) => {
    if (!cursorSample) return null;
    const idx = lap.samples.indexOf(cursorSample);
    if (idx < 0 || idx >= sampleArr.length) return null;
    return sampleArr[idx];
  };
  const cursorA = cursorAt(lapA, a, cursorSampleA);
  const cursorB = lapB ? cursorAt(lapB, b, cursorSampleB) : null;

  // Top legend: chip per metric with name + range; current cursor value if available
  const chipWidth = (w - pad.l - pad.r) / scales.length;

  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{ background: BG }}>
      {/* Top legend strip */}
      {scales.map((scale, i) => {
        const cx = pad.l + i * chipWidth;
        const fmtRange = (() => {
          if (scale.key === "Afr")          return `${scale.min.toFixed(1)}-${scale.max.toFixed(1)}`;
          if (scale.key === "Rpm")          return `0-${(scale.max / 1000).toFixed(1)}k`;
          if (scale.key === "ThrottolePos") return `0-100`;
          return `0-${scale.max.toFixed(0)}`;
        })();
        return (
          <g key={scale.key} transform={`translate(${cx}, 6)`}>
            <rect x={0} y={0} width={9} height={9} fill={scale.color} />
            <text x={14} y={9} fill={scale.color} fontSize={11} fontFamily="monospace" fontWeight="bold">{scale.short}</text>
            <text x={48} y={9} fill={FG_DIM} fontSize={9} fontFamily="monospace">
              {fmtRange}{scale.label ? ` ${scale.label}` : ""}
            </text>
            {cursorA && (
              <text x={chipWidth - 8} y={9} textAnchor="end" fill={scale.color} fontSize={11} fontFamily="monospace" fontWeight="bold">
                {scale.fmt(cursorA[scale.key])}
                {cursorB ? <tspan fill="#22d3ee" opacity={0.85}> / {scale.fmt(cursorB[scale.key])}</tspan> : ""}
              </text>
            )}
          </g>
        );
      })}

      {/* Horizontal grid (visual separation only, no specific values) */}
      {[0.25, 0.5, 0.75].map((t, i) => (
        <line key={i} x1={pad.l} y1={pad.t + t * (h - pad.t - pad.b)} x2={w - pad.r} y2={pad.t + t * (h - pad.t - pad.b)} stroke={STROKE} strokeWidth={0.4} />
      ))}

      {/* Vertical grid */}
      {[0.25, 0.5, 0.75].map((t, i) => (
        <line key={i} x1={pad.l + t * (w - pad.l - pad.r)} y1={pad.t} x2={pad.l + t * (w - pad.l - pad.r)} y2={h - pad.b} stroke={STROKE} strokeWidth={0.3} />
      ))}

      {/* Distance ticks */}
      {[0, 0.25, 0.5, 0.75, 1].map((t, i) => (
        <text key={i} x={pad.l + t * (w - pad.l - pad.r)} y={h - pad.b + 14} fill={FG_MUTE} fontSize={9} fontFamily="monospace"
          textAnchor={i === 0 ? "start" : i === 4 ? "end" : "middle"}>
          {(t * dMax).toFixed(0)}m
        </text>
      ))}

      {/* Lines: compare lap first (dashed, dimmed) so reference draws on top */}
      {b && scales.map((scale) => (
        <path key={`b-${scale.key}`} d={pathOf(b, scale)} fill="none" stroke={scale.color} strokeWidth={1.2} strokeDasharray="4 3" opacity={0.6} />
      ))}
      {scales.map((scale) => (
        <path key={`a-${scale.key}`} d={pathOf(a, scale)} fill="none" stroke={scale.color} strokeWidth={1.6} />
      ))}

      {/* Cursors */}
      {cursorB && (
        <g>
          <line x1={sx(cursorB.d)} y1={pad.t} x2={sx(cursorB.d)} y2={h - pad.b} stroke="#22d3ee" strokeWidth={0.6} opacity={0.55} strokeDasharray="3 2" />
          {scales.map((scale) => (
            <circle key={scale.key} cx={sx(cursorB.d)} cy={syFor(cursorB[scale.key], scale)} r={3} fill={scale.color} stroke="#0a0e14" strokeWidth={1} opacity={0.75} />
          ))}
        </g>
      )}
      {cursorA && (
        <g>
          <line x1={sx(cursorA.d)} y1={pad.t} x2={sx(cursorA.d)} y2={h - pad.b} stroke={ACCENT} strokeWidth={0.8} opacity={0.8} />
          {scales.map((scale) => (
            <circle key={scale.key} cx={sx(cursorA.d)} cy={syFor(cursorA[scale.key], scale)} r={4} fill={scale.color} stroke="#0a0e14" strokeWidth={1.2} />
          ))}
          <text x={sx(cursorA.d) + 6} y={pad.t - 4} fill={ACCENT} fontSize={9} fontFamily="monospace">{cursorA.d.toFixed(0)}m</text>
        </g>
      )}
    </svg>
  );
};

const LapTimesChart = ({ session, lookupRiderForLap, onLapClick, selectedLap, height = 320 }) => {
  if (!session) return null;
  const w = 800, h = height, pad = { l: 60, r: 20, t: 20, b: 40 };
  const racing = session.laps.filter((l) => l.isRacing);
  if (!racing.length) return <div className="text-gray-500 p-6 text-center text-sm font-mono">レーシングラップが検出できません</div>;
  const tMax = Math.max(...racing.map((l) => l.duration)) * 1.05;
  const tMin = Math.min(...racing.map((l) => l.duration)) * 0.95;
  const xMax = Math.max(...racing.map((l) => l.endTime));
  const sx = (t) => pad.l + (t / xMax) * (w - pad.l - pad.r);
  const sy = (d) => h - pad.b - ((d - tMin) / (tMax - tMin)) * (h - pad.t - pad.b);
  const bestDur = Math.min(...racing.map((l) => l.duration));
  const yStep = Math.max(1, Math.ceil((tMax - tMin) / 5));
  const yTicks = [];
  for (let v = Math.ceil(tMin); v <= tMax; v += yStep) yTicks.push(v);
  const xTicks = [];
  for (let m = 0; m * 60 <= xMax; m += Math.max(1, Math.floor(xMax / 60 / 8))) xTicks.push(m * 60);
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{ background: BG }}>
      {yTicks.map((v) => (
        <g key={`y${v}`}>
          <line x1={pad.l} y1={sy(v)} x2={w - pad.r} y2={sy(v)} stroke={STROKE} strokeWidth={0.5} />
          <text x={pad.l - 8} y={sy(v) + 3} fill={FG_MUTE} fontSize={10} fontFamily="monospace" textAnchor="end">{fmtTime(v)}</text>
        </g>
      ))}
      {xTicks.map((t) => (
        <g key={`x${t}`}>
          <line x1={sx(t)} y1={pad.t} x2={sx(t)} y2={h - pad.b} stroke={STROKE} strokeWidth={0.3} opacity={0.5} />
          <text x={sx(t)} y={h - pad.b + 14} fill={FG_MUTE} fontSize={9} fontFamily="monospace" textAnchor="middle">{Math.floor(t / 60)}m</text>
        </g>
      ))}
      <line x1={pad.l} y1={sy(bestDur)} x2={w - pad.r} y2={sy(bestDur)} stroke={ACCENT} strokeWidth={0.5} strokeDasharray="3 3" opacity={0.6} />
      <text x={w - pad.r - 4} y={sy(bestDur) - 4} fill={ACCENT} fontSize={9} fontFamily="monospace" textAnchor="end">BEST {fmtTime(bestDur)}</text>
      {racing.map((lap) => {
        const r = lookupRiderForLap(lap.lap);
        const color = r ? r.color : FG_MUTE;
        const isSelected = selectedLap === lap.lap;
        const isBest = lap.duration === bestDur;
        return (
          <g key={lap.lap} className="cursor-pointer" onClick={() => onLapClick && onLapClick(lap.lap)}>
            <circle cx={sx(lap.endTime)} cy={sy(lap.duration)} r={isSelected ? 6 : isBest ? 5 : 3.5}
              fill={isBest ? ACCENT : color} stroke={isSelected ? FG : "none"} strokeWidth={isSelected ? 2 : 0} opacity={r ? 0.95 : 0.5} />
            {(isBest || isSelected) && (
              <text x={sx(lap.endTime)} y={sy(lap.duration) - 9} fill={FG} fontSize={9} fontFamily="monospace" textAnchor="middle">L{lap.lap}</text>
            )}
          </g>
        );
      })}
      <text x={pad.l} y={pad.t + 10} fill={FG_DIM} fontSize={10} fontFamily="monospace">LAP TIME ↑   ELAPSED TIME →</text>
    </svg>
  );
};

const PaceEvolution = ({ session, height = 200 }) => {
  if (!session) return null;
  const w = 800, h = height, pad = { l: 60, r: 20, t: 20, b: 30 };
  const racing = session.laps.filter((l) => l.isRacing);
  if (racing.length < 3) return null;
  const tMax = Math.max(...racing.map((l) => l.duration)) * 1.05;
  const tMin = Math.min(...racing.map((l) => l.duration)) * 0.95;
  const xMax = Math.max(...racing.map((l) => l.endTime));
  const sx = (t) => pad.l + (t / xMax) * (w - pad.l - pad.r);
  const sy = (d) => h - pad.b - ((d - tMin) / (tMax - tMin)) * (h - pad.t - pad.b);
  const win = 3;
  const rolling = racing.map((lap, i) => {
    const lo = Math.max(0, i - Math.floor(win / 2));
    const hi = Math.min(racing.length, lo + win);
    const slice = racing.slice(lo, hi);
    return { t: lap.endTime, v: slice.reduce((a, l) => a + l.duration, 0) / slice.length };
  });
  const path = rolling.map((p, i) => `${i ? "L" : "M"}${sx(p.t).toFixed(1)},${sy(p.v).toFixed(1)}`).join("");
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{ background: BG }}>
      {[tMin, (tMin + tMax) / 2, tMax].map((v) => (
        <g key={v}>
          <line x1={pad.l} y1={sy(v)} x2={w - pad.r} y2={sy(v)} stroke={STROKE} strokeWidth={0.3} />
          <text x={pad.l - 6} y={sy(v) + 3} fill={FG_MUTE} fontSize={9} fontFamily="monospace" textAnchor="end">{fmtTime(v)}</text>
        </g>
      ))}
      <path d={path} fill="none" stroke="#22d3ee" strokeWidth={1.5} />
      {racing.map((lap, i) => (<circle key={i} cx={sx(lap.endTime)} cy={sy(lap.duration)} r={1.5} fill={FG_DIM} opacity={0.5} />))}
    </svg>
  );
};

// ─── Responsive: detect mobile (< 768px) ─────────────────────────
const useIsMobile = (breakpoint = 768) => {
  const [isMobile, setIsMobile] = useState(typeof window !== "undefined" ? window.innerWidth < breakpoint : false);
  useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth < breakpoint);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, [breakpoint]);
  return isMobile;
};

// ─── Main app ────────────────────────────────────────────────────
function DroggerAnalyzer() {
  const [sessions, setSessions] = useState([]);
  const [activeSessionId, setActiveSessionId] = useState(null);
  const [riders, setRiders] = useState([]);
  const [stintAssignments, setStintAssignments] = useState({});
  const [activeTab, setActiveTab] = useState("overview");
  const [selectedLap, setSelectedLap] = useState(null);
  const [compareLap, setCompareLap] = useState(null);
  const [parseError, setParseError] = useState(null);
  // Lap line edit mode (manual override of auto-detected S/F position)
  const [lapLineEditMode, setLapLineEditMode] = useState(false);
  // Lap selection view mode: "chips" (compact buttons) or "table" (full stats)
  const [lapView, setLapView] = useState("table");
  // Playback (animation) state
  const [playbackProgress, setPlaybackProgress] = useState(0);   // 0-1
  const [isPlaying, setIsPlaying] = useState(false);
  const [playbackSpeed, setPlaybackSpeed] = useState(1);          // 0.25 / 0.5 / 1 / 2 / 4
  // Mobile responsive
  const isMobile = useIsMobile();
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [aboutOpen, setAboutOpen] = useState(false);
  const fileInputRef = useRef(null);

  const activeSession = sessions.find((s) => s.id === activeSessionId);
  // Fallback active tab if it requires capabilities the current session lacks
  useEffect(() => {
    if (!activeSession) return;
    if ((activeTab === "track" || activeTab === "compare") && !activeSession.hasGps) {
      setActiveTab("overview");
    }
    if (activeTab === "tuning" && !activeSession.hasAfr) {
      setActiveTab("overview");
    }
  }, [activeSession?.id, activeSession?.hasGps, activeSession?.hasAfr, activeTab]);
  const activeStintMap = activeSession ? (stintAssignments[activeSession.id] || {}) : {};

  const handleFiles = useCallback(async (fileList) => {
    setParseError(null);
    const files = Array.from(fileList);
    const newSessions = [];
    for (const file of files) {
      try {
        // Warn for very large files (especially aRacer SP smartphone logs which can exceed 100MB)
        if (file.size > 80 * 1024 * 1024) {
          console.warn(`Large file: ${file.name} (${(file.size/1024/1024).toFixed(0)}MB) — parsing may take a while`);
        }
        const text = await readFileAsText(file);
        const fmt = detectLogFormat(text);

        const lc = file.name.toLowerCase();
        const isRace = lc.includes("race") || file.name.includes("本番");
        const isQual = lc.includes("qual") || file.name.includes("予選");
        const type = isRace ? "race" : isQual ? "qualifying" : "practice";
        const baseName = file.name.replace(/\.(csv|loga)$/i, "");

        if (fmt === "drogger") {
          const parsed = Papa.parse(text, { header: true, dynamicTyping: true, skipEmptyLines: true });
          if (!parsed.data.length || !("Lap" in parsed.data[0])) {
            setParseError(`${file.name}: Drogger CSVではないようです（Lap列がありません）`);
            continue;
          }
          const session = parseSession(parsed.data, baseName, type, { source: "drogger", hasGps: true });
          newSessions.push(session);
        } else if (fmt === "aracer_sp" || fmt === "aracer_ecu" || fmt === "aracer_lm") {
          const { data, hasGps } = parseAracerLog(text, fmt);
          if (!data.length) {
            setParseError(`${file.name}: aRacer ログのデータが空です`);
            continue;
          }
          // For aRacer LM with valid GPS but empty IR_LapNumber: detect laps from GPS trajectory
          const allZeroLap = data.every((r) => r.Lap === 0);
          let lapRef = null;
          if (hasGps && allZeroLap) {
            lapRef = detectLapsFromGps(data);
          }
          const session = parseSession(data, baseName, type, { source: fmt, hasGps, lapRef });
          newSessions.push(session);
        } else {
          setParseError(`${file.name}: 認識できないログ形式です（Drogger CSV または aRacer .loga が対象）`);
          continue;
        }
      } catch (e) { setParseError(`${file.name}: ${e.message}`); }
    }
    if (newSessions.length) {
      setSessions((prev) => [...prev, ...newSessions]);
      if (!activeSessionId) setActiveSessionId(newSessions[0].id);
      setStintAssignments((sa) => {
        const next = { ...sa };
        newSessions.forEach((s) => { if (!next[s.id]) next[s.id] = {}; });
        return next;
      });
      setRiders((rs) => rs.length === 0 ? [{ id: newId(), name: "Rider 1", color: RIDER_COLORS[0] }] : rs);
    }
  }, [activeSessionId]);

  const removeSession = (id) => {
    setSessions((s) => s.filter((x) => x.id !== id));
    if (activeSessionId === id) setActiveSessionId(sessions.find((s) => s.id !== id)?.id || null);
    setStintAssignments((sa) => { const c = { ...sa }; delete c[id]; return c; });
  };

  const setSessionEngineType = (id, engineType) => {
    setSessions((ss) => ss.map((s) => (s.id === id ? { ...s, engineType } : s)));
  };

  // Manually override the lap line (called when user clicks on Track plot
  // in edit mode). Only enabled for sessions where lap detection was GPS-based
  // to begin with (aRacer LM) — meaning lapRef exists. For Drogger / aRacer
  // SP/ECU, the edit UI is hidden, so this is never called for those.
  const handleSetLapLine = useCallback((newLat, newLon) => {
    if (!activeSessionId) return;
    setSessions((ss) => ss.map((s) => {
      if (s.id !== activeSessionId) return s;
      const newRef = { Latitude: newLat, Longitude: newLon };
      const result = recomputeLapsForSession(s, newRef);
      // Sanity check: if the new ref produces too few laps (e.g. user clicked
      // off the racing line), reject and warn the user
      if (result.laps.length < Math.max(2, s.laps.length * 0.3)) {
        alert(`クリック位置からはラップが正しく検出できませんでした (${result.laps.length}周のみ検出)。\nコース上のレーシングライン付近をクリックしてください。`);
        return s; // keep original
      }
      return result;
    }));
    setSelectedLap(null);
    setCompareLap(null);
    setLapLineEditMode(false);
  }, [activeSessionId]);

  const addRider = () => {
    setRiders((rs) => [...rs, { id: newId(), name: `Rider ${rs.length + 1}`, color: RIDER_COLORS[rs.length % RIDER_COLORS.length] }]);
  };
  const updateRider = (id, key, val) => setRiders((rs) => rs.map((r) => (r.id === id ? { ...r, [key]: val } : r)));
  const removeRider = (id) => {
    setRiders((rs) => rs.filter((r) => r.id !== id));
    setStintAssignments((sa) => {
      const next = {};
      for (const sid of Object.keys(sa)) {
        next[sid] = {};
        for (const stintId of Object.keys(sa[sid])) {
          if (sa[sid][stintId] !== id) next[sid][stintId] = sa[sid][stintId];
        }
      }
      return next;
    });
  };

  const assignStintToRider = (sessionId, stintId, riderId) => {
    setStintAssignments((sa) => {
      const sessMap = { ...(sa[sessionId] || {}) };
      if (riderId) sessMap[stintId] = riderId;
      else delete sessMap[stintId];
      return { ...sa, [sessionId]: sessMap };
    });
  };

  const lookupRiderForLap = useCallback((lapNum) => {
    if (!activeSession) return null;
    const stint = activeSession.stints.find((st) => lapNum >= st.startLap && lapNum <= st.endLap);
    if (!stint) return null;
    const riderId = activeStintMap[stint.id];
    if (!riderId) return null;
    return riders.find((r) => r.id === riderId) || null;
  }, [activeSession, activeStintMap, riders]);

  const riderStats = useMemo(() => {
    if (!activeSession) return [];
    return riders.map((r) => {
      const myStintIds = Object.keys(activeStintMap).filter((sid) => activeStintMap[sid] === r.id);
      const myStints = activeSession.stints.filter((st) => myStintIds.includes(st.id));
      const allLaps = myStints.flatMap((st) => st.laps).filter((l) => l.isRacing);
      if (!allLaps.length) return { ...r, lapCount: 0, stintCount: myStints.length };
      const durations = allLaps.map((l) => l.duration).sort((a, b) => a - b);
      return { ...r, lapCount: allLaps.length, stintCount: myStints.length,
        bestLap: durations[0], avgLap: durations.reduce((a, b) => a + b, 0) / durations.length,
        worstLap: durations[durations.length - 1], consistency: durations[durations.length - 1] - durations[0],
        maxRpm: Math.max(...allLaps.map((l) => l.maxRpm)), maxSpeed: Math.max(...allLaps.map((l) => l.maxSpeed)) };
    });
  }, [activeSession, activeStintMap, riders]);

  const theoreticalBest = useMemo(() => {
    if (!activeSession) return null;
    const racing = activeSession.laps.filter((l) => l.isRacing);
    if (racing.length < 2) return null;
    const N = 6;
    const sectorBest = new Array(N).fill(Infinity);
    racing.forEach((lap) => {
      const sectorDur = lap.duration / N;
      for (let i = 0; i < N; i++) if (sectorDur < sectorBest[i]) sectorBest[i] = sectorDur;
    });
    return { sectors: sectorBest, total: sectorBest.reduce((a, b) => a + b, 0), N };
  }, [activeSession]);

  const selectedLapObj = activeSession?.laps.find((l) => l.lap === selectedLap);
  const compareLapObj = activeSession?.laps.find((l) => l.lap === compareLap);

  // Reset playback when lap selection changes
  useEffect(() => {
    setPlaybackProgress(0);
    setIsPlaying(false);
  }, [selectedLap, compareLap, activeTab]);

  // The wall-clock span that progress 0-1 covers. In Compare mode, the
  // longer of the two lap durations so both finish within view.
  const playbackDuration = useMemo(() => {
    if (!selectedLapObj) return 0;
    if (activeTab === "compare" && compareLapObj) {
      return Math.max(selectedLapObj.duration, compareLapObj.duration);
    }
    return selectedLapObj.duration;
  }, [selectedLapObj, compareLapObj, activeTab]);

  // Animation loop using requestAnimationFrame
  useEffect(() => {
    if (!isPlaying || !playbackDuration) return;
    let lastTime = performance.now();
    let raf;
    const tick = (now) => {
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      setPlaybackProgress((p) => {
        const next = p + (dt * playbackSpeed) / playbackDuration;
        if (next >= 1) { setIsPlaying(false); return 1; }
        return next;
      });
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [isPlaying, playbackSpeed, playbackDuration]);

  const togglePlay = () => {
    if (playbackProgress >= 1) {
      setPlaybackProgress(0);
      setIsPlaying(true);
    } else {
      setIsPlaying((p) => !p);
    }
  };
  const resetPlay = () => { setPlaybackProgress(0); setIsPlaying(false); };

  const elapsedSec = playbackProgress * playbackDuration;
  const refCursor = selectedLapObj ? sampleAtElapsed(selectedLapObj, elapsedSec) : null;
  const cmpCursor = compareLapObj ? sampleAtElapsed(compareLapObj, elapsedSec) : null;
  // Capped elapsed for each lap (so a fast lap's clock parks at its laptime)
  const refElapsedDisplay = selectedLapObj ? Math.min(elapsedSec, selectedLapObj.duration) : 0;
  const cmpElapsedDisplay = compareLapObj ? Math.min(elapsedSec, compareLapObj.duration) : 0;

  return (
    <div className="min-h-screen w-full" style={{ background: BG, color: FG, fontFamily: "ui-sans-serif, system-ui, -apple-system" }}>
      <div className="border-b border-[#252d3a] flex items-center justify-between" style={{ background: PANEL, padding: isMobile ? "10px 12px" : "12px 16px" }}>
        <div className="flex items-center gap-2 min-w-0">
          {isMobile && (
            <button onClick={() => setDrawerOpen(true)} className="p-2 -ml-2 text-gray-300 active:text-yellow-400" style={{ touchAction: "manipulation" }}>
              <Menu size={22} />
            </button>
          )}
          <div className="w-2 h-6" style={{ background: ACCENT }}></div>
          <div className="min-w-0">
            <div className="font-mono text-sm tracking-[0.2em] uppercase truncate">{isMobile ? "DROGGER" : "Drogger // Telemetry"}</div>
            {!isMobile && (
              <div className="font-mono text-[9px] tracking-wider text-gray-500 uppercase">Endurance Analyzer v{APP_VERSION}</div>
            )}
          </div>
        </div>
        <div className="flex items-center gap-2 flex-shrink-0">
          <input ref={fileInputRef} type="file" accept=".csv,.loga,text/plain,text/csv,application/octet-stream" multiple className="hidden"
            onChange={(e) => { if (e.target.files) handleFiles(e.target.files); }} />
          <button onClick={() => setAboutOpen(true)} className="p-2 text-gray-400 hover:text-yellow-400 active:text-yellow-400 transition" title="About / バージョン情報" style={{ touchAction: "manipulation" }}>
            <Info size={isMobile ? 20 : 18} />
          </button>
          <Btn onClick={() => fileInputRef.current?.click()} primary>
            <Upload size={12} className="inline mr-1.5" />{isMobile ? "CSV" : "CSV Load"}
          </Btn>
        </div>
      </div>

      {parseError && (
        <div className="mx-4 mt-3 px-3 py-2 border border-red-500/40 bg-red-500/10 text-red-300 font-mono text-xs flex items-center gap-2">
          <AlertCircle size={14} />{parseError}
        </div>
      )}

      <div className="flex" style={{ minHeight: "calc(100vh - 60px)" }}>
        {/* Drawer overlay (mobile only) */}
        {isMobile && drawerOpen && (
          <div className="fixed inset-0 z-40 bg-black bg-opacity-60" onClick={() => setDrawerOpen(false)}></div>
        )}
        {/* Sidebar (drawer on mobile, fixed-left on desktop) */}
        <div className={isMobile
          ? `fixed top-0 left-0 h-full z-50 border-r border-[#252d3a] flex flex-col transition-transform duration-200 ${drawerOpen ? "translate-x-0" : "-translate-x-full"}`
          : "w-80 border-r border-[#252d3a] flex flex-col"}
          style={{ background: PANEL, width: isMobile ? "85vw" : 320, maxWidth: isMobile ? 360 : "none", overflowY: isMobile ? "auto" : "visible" }}>
          {isMobile && (
            <div className="px-3 py-2 border-b border-[#252d3a] flex items-center justify-between" style={{ background: PANEL_2 }}>
              <span className="font-mono text-[10px] uppercase tracking-[0.18em] text-gray-400">Menu</span>
              <button onClick={() => setDrawerOpen(false)} className="p-2 -mr-2 text-gray-400 active:text-yellow-400">
                <X size={18} />
              </button>
            </div>
          )}
          <div className="p-3 border-b border-[#252d3a]">
            <div className="flex items-center justify-between mb-2">
              <div className="text-[10px] uppercase tracking-[0.18em] font-mono text-gray-500 flex items-center gap-1.5">
                <UserCog size={11} /> Team Roster
              </div>
              <Btn small onClick={addRider}><Plus size={10} className="inline" /> Rider</Btn>
            </div>
            {riders.length === 0 ? (
              <div className="text-[10px] font-mono text-gray-600 py-2">ライダーを追加してください</div>
            ) : (
              <div className="space-y-1.5">
                {riders.map((r) => (
                  <div key={r.id} className="flex items-center gap-2 group">
                    <input type="color" value={r.color} onChange={(e) => updateRider(r.id, "color", e.target.value)}
                      className="cursor-pointer bg-transparent border-0 p-0" style={{ borderRadius: 2, width: isMobile ? 32 : 20, height: isMobile ? 32 : 20 }} />
                    <input value={r.name} onChange={(e) => updateRider(r.id, "name", e.target.value)}
                      className="flex-1 bg-[#0a0e14] border border-[#252d3a] font-mono text-gray-200 focus:border-yellow-400 outline-none"
                      style={{ borderRadius: 2, padding: isMobile ? "8px 10px" : "2px 8px", fontSize: isMobile ? 16 : 12 }} placeholder="ライダー名" />
                    <button onClick={() => removeRider(r.id)} className={`text-gray-500 active:text-red-400 hover:text-red-400 transition ${isMobile ? "p-2" : "opacity-0 group-hover:opacity-100"}`}>
                      <Trash2 size={isMobile ? 14 : 11} />
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="p-3 border-b border-[#252d3a]">
            <div className="text-[10px] uppercase tracking-[0.18em] font-mono text-gray-500 mb-2">Sessions</div>
            {sessions.length === 0 && (
              <div className="border-2 border-dashed border-[#252d3a] py-8 text-center text-gray-500 text-xs font-mono cursor-pointer hover:border-yellow-400 hover:text-yellow-400 transition"
                onClick={() => fileInputRef.current?.click()}
                onDragOver={(e) => e.preventDefault()}
                onDrop={(e) => { e.preventDefault(); handleFiles(e.dataTransfer.files); }}>
                DROP CSV<br />FILES HERE
              </div>
            )}
            <div className="space-y-1">
              {sessions.map((s) => (
                <div key={s.id}
                  onClick={() => { setActiveSessionId(s.id); setSelectedLap(null); setCompareLap(null); if (isMobile) setDrawerOpen(false); }}
                  className={`px-2 py-1.5 cursor-pointer border-l-2 group flex items-center justify-between ${activeSessionId === s.id ? "border-yellow-400 bg-[#1a212c]" : "border-transparent hover:bg-[#1a212c]"}`}>
                  <div className="min-w-0 flex-1">
                    <div className="font-mono text-xs text-gray-200 truncate">{s.name}</div>
                    <div className="font-mono text-[9px] text-gray-500 mt-0.5 flex items-center gap-2">
                      <span className={`px-1 ${s.type === "race" ? "bg-red-900/50 text-red-300" : s.type === "qualifying" ? "bg-blue-900/50 text-blue-300" : "bg-gray-700/50 text-gray-300"}`}>
                        {s.type.toUpperCase()}
                      </span>
                      {s.laps.length} laps · {s.stints.length} stints · {(s.duration / 60).toFixed(0)}m
                    </div>
                  </div>
                  <button onClick={(e) => { e.stopPropagation(); removeSession(s.id); }} className="opacity-0 group-hover:opacity-100 text-gray-500 hover:text-red-400">
                    <X size={12} />
                  </button>
                </div>
              ))}
            </div>
          </div>

          {activeSession && (
            <div className="p-3 flex-1 overflow-y-auto">
              <div className="text-[10px] uppercase tracking-[0.18em] font-mono text-gray-500 mb-2 flex items-center gap-1.5">
                <Users size={11} /> Stint Assignment
                <span className="text-gray-700 normal-case tracking-normal">— {activeSession.stints.length} detected</span>
              </div>
              {activeSession.stints.length === 0 ? (
                <div className="text-[10px] font-mono text-gray-600 py-2">スティントが検出されませんでした</div>
              ) : (
                <div className="space-y-1.5">
                  {activeSession.stints.map((st, i) => {
                    const riderId = activeStintMap[st.id];
                    const rider = riders.find((r) => r.id === riderId);
                    return (
                      <div key={st.id} className="border border-[#252d3a] p-2 flex items-center gap-2"
                        style={{ background: PANEL_2, borderRadius: 2, borderLeftColor: rider ? rider.color : STROKE, borderLeftWidth: 2 }}>
                        <div className="flex-1 min-w-0">
                          <div className="font-mono text-[11px] text-gray-200">
                            <span className="text-gray-500">STINT {i + 1}</span>
                            <span className="ml-1.5">L{st.startLap}–L{st.endLap}</span>
                          </div>
                          <div className="font-mono text-[9px] text-gray-500 mt-0.5">
                            {st.laps.length} laps · {(st.laps.reduce((a, l) => a + l.duration, 0) / 60).toFixed(1)}m
                          </div>
                        </div>
                        <RiderSelect value={riderId} onChange={(rid) => assignStintToRider(activeSession.id, st.id, rid)}
                          riders={riders} placeholder="未割当" small />
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}
        </div>

        {/* Main */}
        <div className="flex-1 flex flex-col">
          {!activeSession ? (
            <div className="flex-1 flex items-center justify-center text-gray-500">
              <div className="text-center">
                <Activity size={48} className="mx-auto mb-3 text-gray-700" />
                <div className="font-mono text-sm tracking-wider uppercase">No Session Loaded</div>
                <div className="font-mono text-xs text-gray-600 mt-1">Drop a Drogger CSV to begin</div>
              </div>
            </div>
          ) : (
            <>
              {/* Session header with engine type selector */}
              <div className="border-b border-[#252d3a] flex items-center justify-between gap-2" style={{ background: PANEL, padding: isMobile ? "6px 12px" : "8px 16px" }}>
                <div className="flex items-center gap-2 min-w-0 flex-1">
                  <div className="w-1 h-5 flex-shrink-0" style={{ background: ACCENT }}></div>
                  <div className="font-mono text-xs text-gray-200 truncate" style={{ maxWidth: isMobile ? "calc(100vw - 240px)" : "28rem" }}>{activeSession.name}</div>
                  {(() => {
                    // Source badge: DRG / SP / ECU / LM
                    const srcMap = {
                      drogger:    { label: "DRG", color: "bg-yellow-700/40 text-yellow-300" },
                      aracer_sp:  { label: "aR-SP", color: "bg-purple-900/50 text-purple-300" },
                      aracer_ecu: { label: "aR-ECU", color: "bg-purple-900/50 text-purple-300" },
                      aracer_lm:  { label: "aR-LM", color: "bg-fuchsia-900/50 text-fuchsia-300" },
                    };
                    const s = srcMap[activeSession.source] || srcMap.drogger;
                    return (
                      <span className={`font-mono text-[9px] px-1.5 py-0.5 flex-shrink-0 ${s.color}`} style={{ borderRadius: 2 }}>
                        {s.label}
                      </span>
                    );
                  })()}
                  {!isMobile && (
                    <span className={`font-mono text-[9px] px-1.5 py-0.5 ${activeSession.type === "race" ? "bg-red-900/50 text-red-300" : activeSession.type === "qualifying" ? "bg-blue-900/50 text-blue-300" : "bg-gray-700/50 text-gray-300"}`}>
                      {activeSession.type.toUpperCase()}
                    </span>
                  )}
                </div>
                <div className="flex items-center gap-2 flex-shrink-0">
                  {!isMobile && <span className="font-mono text-[10px] uppercase tracking-[0.18em] text-gray-500">Engine</span>}
                  <div className="flex border border-[#252d3a]" style={{ borderRadius: 2 }}>
                    {["2st", "4st"].map((t) => {
                      const active = activeSession.engineType === t;
                      return (
                        <button key={t} onClick={() => setSessionEngineType(activeSession.id, t)}
                          className={`font-mono uppercase tracking-wider transition ${active ? "bg-yellow-400 text-black" : "bg-transparent text-gray-300 hover:text-yellow-400"}`}
                          style={{ padding: isMobile ? "6px 10px" : "4px 12px", fontSize: 10 }}>
                          {t}
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>

              <div className="border-b border-[#252d3a] flex items-stretch overflow-x-auto" style={{ background: PANEL, paddingLeft: isMobile ? 4 : 12, paddingRight: isMobile ? 4 : 12 }}>
                {[
                  { id: "overview", label: "Overview", Icon: Activity },
                  ...(activeSession.hasGps ? [
                    { id: "track", label: "Track", Icon: MapPin },
                    { id: "compare", label: "Compare", Icon: Layers },
                  ] : []),
                  { id: "riders", label: "Riders", Icon: Users },
                  { id: "strategy", label: "Strategy", Icon: Gauge },
                  ...(activeSession.hasAfr ? [{ id: "tuning", label: "Tuning", Icon: Gauge }] : []),
                ].map(({ id, label, Icon }) => {
                  const active = activeTab === id;
                  return (
                    <button key={id} onClick={() => { setActiveTab(id); if (isMobile) setDrawerOpen(false); }}
                      className={`font-mono uppercase tracking-wider flex items-center gap-1.5 border-b-2 transition flex-shrink-0 ${active ? "border-yellow-400 text-yellow-400" : "border-transparent text-gray-400 hover:text-gray-200"}`}
                      style={{ padding: isMobile ? "12px 14px" : "10px 16px", fontSize: isMobile ? 11 : 12, touchAction: "manipulation" }}>
                      <Icon size={isMobile ? 14 : 12} />{label}
                    </button>
                  );
                })}
              </div>

              <div className={`flex-1 overflow-y-auto space-y-3 ${isMobile ? "p-2" : "p-4 space-y-4"}`}>
                {activeTab === "overview" && (<>
                  <div className={`grid gap-3 ${isMobile ? "grid-cols-2" : "grid-cols-6"}`}>
                    {(() => {
                      const racing = activeSession.laps.filter((l) => l.isRacing);
                      const best = racing.length ? Math.min(...racing.map((l) => l.duration)) : null;
                      const avg = racing.length ? racing.reduce((a, l) => a + l.duration, 0) / racing.length : null;
                      const maxRpm = Math.max(...activeSession.laps.map((l) => l.maxRpm));
                      const maxSpd = Math.max(...activeSession.laps.map((l) => l.maxSpeed));
                      return (<>
                        <Panel className="p-3"><Stat label="Total Time" value={(activeSession.duration / 60).toFixed(1)} unit="min" /></Panel>
                        <Panel className="p-3"><Stat label="Racing Laps" value={racing.length} unit="" /></Panel>
                        <Panel className="p-3"><Stat label="Best Lap" value={best ? fmtTime(best) : "—"} unit="" /></Panel>
                        <Panel className="p-3"><Stat label="Avg Lap" value={avg ? fmtTime(avg) : "—"} unit="" /></Panel>
                        <Panel className="p-3"><Stat label="Max RPM" value={maxRpm.toFixed(0)} unit="rpm" /></Panel>
                        <Panel className="p-3"><Stat label="Top Speed" value={fmtNum(maxSpd, 1)} unit="km/h" /></Panel>
                      </>);
                    })()}
                  </div>
                  <Panel title="Lap Times — colored by assigned rider, click to inspect" accent>
                    <div className="p-2"><LapTimesChart session={activeSession} lookupRiderForLap={lookupRiderForLap} onLapClick={(l) => setSelectedLap(l)} selectedLap={selectedLap} /></div>
                  </Panel>
                  <Panel title="Pace Evolution (3-lap rolling avg)" accent>
                    <div className="p-2"><PaceEvolution session={activeSession} /></div>
                  </Panel>
                </>)}

                {activeTab === "track" && (<>
                  <Panel title="Lap Selection" accent
                    actions={
                      <div className="flex items-center" style={{ border: `1px solid ${STROKE}`, borderRadius: 2 }}>
                        {[
                          { id: "chips",  label: "Chips" },
                          { id: "table",  label: "Table" },
                        ].map((v) => (
                          <button key={v.id} onClick={() => setLapView(v.id)}
                            className="font-mono uppercase tracking-wider transition"
                            style={{
                              background: lapView === v.id ? ACCENT : "transparent",
                              color: lapView === v.id ? "#000" : FG_DIM,
                              padding: "3px 8px",
                              fontSize: 9,
                            }}>
                            {v.label}

                                        <span className="text-gray-300">{r.name}</span>
                                      </span>
                                    ) : (<span className="text-gray-600">—</span>)}
                                  </td>
                                </tr>
                              );
                            });
                          })()}
                        </tbody>
                      </table>
                    </div>
                  </Panel>
                </>)}

                {activeTab === "tuning" && activeSession.hasAfr && (() => {
                  const allSamples = activeSession.laps.flatMap((l) => l.samples)
                    .filter((s) => s.Rpm > 1000 && s.Afr >= AFR_MIN && s.Afr <= AFR_MAX);
                  if (!allSamples.length) {
                    return (<Panel className="p-8 text-center text-gray-500 font-mono text-xs">A/Fデータが解析できません</Panel>);
                  }
                  const target = AFR_TARGETS[activeSession.engineType] || AFR_TARGETS["4st"];

                  const nBins = 24;
                  const binSize = (AFR_MAX - AFR_MIN) / nBins;
                  const bins = new Array(nBins).fill(0);
                  allSamples.forEach((s) => {
                    const b = Math.min(nBins - 1, Math.max(0, Math.floor((s.Afr - AFR_MIN) / binSize)));
                    bins[b]++;
                  });
                  const binMax = Math.max(...bins);
                  const totalSamples = allSamples.length;

                  const lapWOT = activeSession.laps
                    .filter((l) => l.isRacing)
                    .map((l) => {
                      const wot = l.samples.filter((s) => s.ThrottolePos > 60 && s.Afr >= AFR_MIN);
                      const avg = wot.length ? wot.reduce((a, s) => a + s.Afr, 0) / wot.length : null;
                      return { lap: l.lap, avg, count: wot.length };
                    })
                    .filter((d) => d.avg != null);

                  const stride = Math.max(1, Math.floor(allSamples.length / 2000));
                  const scatter = allSamples.filter((_, i) => i % stride === 0);

                  const sortedAfr = allSamples.map((s) => s.Afr).sort((a, b) => a - b);
                  const median = sortedAfr[Math.floor(sortedAfr.length / 2)];
                  const inTarget = allSamples.filter((s) => s.Afr >= target.low && s.Afr <= target.high).length;
                  const tooLean = allSamples.filter((s) => s.Afr > target.high).length;
                  const tooRich = allSamples.filter((s) => s.Afr < target.low).length;

                  return (<>
                    <Panel className="p-3">
                      <div className="text-[10px] uppercase tracking-[0.18em] font-mono text-gray-500 mb-2">
                        A/F Summary — engine: {activeSession.engineType.toUpperCase()} · target {target.low}–{target.high}
                      </div>
                      <div className={`grid gap-3 ${isMobile ? "grid-cols-2" : "grid-cols-5"}`}>
                        <Stat label="Samples" value={totalSamples.toLocaleString()} />
                        <Stat label="Median A/F" value={median.toFixed(2)} />
                        <Stat label="In Target" value={`${(100 * inTarget / totalSamples).toFixed(1)}%`} />
                        <Stat label="Rich" value={`${(100 * tooRich / totalSamples).toFixed(1)}%`} />
                        <Stat label="Lean" value={`${(100 * tooLean / totalSamples).toFixed(1)}%`} />
                      </div>
                    </Panel>

                    <Panel title="A/F Histogram (full session)" accent>
                      <svg viewBox="0 0 800 240" className="w-full" style={{ background: BG }}>
                        {[0.25, 0.5, 0.75, 1].map((t, i) => (
                          <line key={i} x1={50} y1={20 + (180 * (1 - t))} x2={780} y2={20 + (180 * (1 - t))} stroke={STROKE} strokeWidth={0.5} />
                        ))}
                        {bins.map((count, i) => {
                          const afrLow = AFR_MIN + i * binSize;
                          const afrCenter = afrLow + binSize / 2;
                          const barH = (count / binMax) * 180;
                          const xL = 50 + (i * (730 / nBins));
                          const wd = 730 / nBins - 1;
                          return (<rect key={i} x={xL} y={200 - barH} width={wd} height={barH} fill={afrColor(afrCenter, activeSession.engineType)} />);
                        })}
                        <rect x={50 + ((target.low - AFR_MIN) / (AFR_MAX - AFR_MIN)) * 730}
                              y={20}
                              width={((target.high - target.low) / (AFR_MAX - AFR_MIN)) * 730}
                              height={180}
                              fill="none" stroke={ACCENT} strokeWidth={1} strokeDasharray="3 3" opacity={0.7} />
                        {[8, 10, 12, 14, 14.7, 16, 18, 20].map((v, i) => {
                          const x = 50 + ((v - AFR_MIN) / (AFR_MAX - AFR_MIN)) * 730;
                          return (
                            <g key={i}>
                              <line x1={x} y1={200} x2={x} y2={205} stroke={FG_MUTE} strokeWidth={0.5} />
                              <text x={x} y={218} fill={FG_DIM} fontSize={10} fontFamily="monospace" textAnchor="middle">{v}</text>
                            </g>
                          );
                        })}
                        <text x={50} y={15} fill={FG_DIM} fontSize={10} fontFamily="monospace">samples ↑</text>
                        <text x={780} y={234} textAnchor="end" fill={FG_DIM} fontSize={10} fontFamily="monospace">A/F →</text>
                      </svg>
                    </Panel>

                    <Panel title="RPM × A/F — engine map check" accent>
                      <svg viewBox="0 0 800 320" className="w-full" style={{ background: BG }}>
                        {(() => {
                          const rpmMax = Math.max(...scatter.map((s) => s.Rpm)) * 1.05;
                          const sx = (r) => 50 + (r / rpmMax) * 730;
                          const sy = (a) => 280 - ((a - AFR_MIN) / (AFR_MAX - AFR_MIN)) * 260;
                          return (<>
                            <rect x={50} y={sy(target.high)} width={730} height={sy(target.low) - sy(target.high)}
                              fill={ACCENT} opacity={0.08} />
                            {[8, 10, 12, 13, 14, 14.7, 16, 18, 20].map((v, i) => (
                              <g key={i}>
                                <line x1={50} y1={sy(v)} x2={780} y2={sy(v)} stroke={STROKE} strokeWidth={0.3} />
                                <text x={45} y={sy(v) + 3} textAnchor="end" fill={FG_DIM} fontSize={9} fontFamily="monospace">{v}</text>
                              </g>
                            ))}
                            {[2000, 4000, 6000, 8000, 10000, 12000].filter((v) => v <= rpmMax).map((v, i) => (
                              <g key={i}>
                                <line x1={sx(v)} y1={20} x2={sx(v)} y2={280} stroke={STROKE} strokeWidth={0.3} />
                                <text x={sx(v)} y={295} textAnchor="middle" fill={FG_DIM} fontSize={9} fontFamily="monospace">{v.toLocaleString()}</text>
                              </g>
                            ))}
                            {scatter.map((s, i) => (
                              <circle key={i} cx={sx(s.Rpm)} cy={sy(s.Afr)} r={1.4} fill={afrColor(s.Afr, activeSession.engineType)} opacity={0.65} />
                            ))}
                            <text x={50} y={15} fill={FG_DIM} fontSize={10} fontFamily="monospace">A/F ↑</text>
                            <text x={780} y={313} textAnchor="end" fill={FG_DIM} fontSize={10} fontFamily="monospace">RPM →</text>
                          </>);
                        })()}
                      </svg>
                    </Panel>

                    {activeSession.hasThrottle && (
                      <Panel title="Throttle × A/F — load mapping" accent>
                        <svg viewBox="0 0 800 320" className="w-full" style={{ background: BG }}>
                          {(() => {
                            const sx = (t) => 50 + (t / 100) * 730;
                            const sy = (a) => 280 - ((a - AFR_MIN) / (AFR_MAX - AFR_MIN)) * 260;
                            const throttled = scatter.filter((s) => s.ThrottolePos > 0);
                            return (<>
                              <rect x={50} y={sy(target.high)} width={730} height={sy(target.low) - sy(target.high)}
                                fill={ACCENT} opacity={0.08} />
                              {[8, 10, 12, 13, 14, 14.7, 16, 18, 20].map((v, i) => (
                                <g key={i}>
                                  <line x1={50} y1={sy(v)} x2={780} y2={sy(v)} stroke={STROKE} strokeWidth={0.3} />
                                  <text x={45} y={sy(v) + 3} textAnchor="end" fill={FG_DIM} fontSize={9} fontFamily="monospace">{v}</text>
                                </g>
                              ))}
                              {[0, 25, 50, 75, 100].map((v, i) => (
                                <g key={i}>
                                  <line x1={sx(v)} y1={20} x2={sx(v)} y2={280} stroke={STROKE} strokeWidth={0.3} />
                                  <text x={sx(v)} y={295} textAnchor="middle" fill={FG_DIM} fontSize={9} fontFamily="monospace">{v}%</text>
                                </g>
                              ))}
                              {throttled.map((s, i) => (
                                <circle key={i} cx={sx(s.ThrottolePos)} cy={sy(s.Afr)} r={1.4} fill={afrColor(s.Afr, activeSession.engineType)} opacity={0.65} />
                              ))}
                              <text x={50} y={15} fill={FG_DIM} fontSize={10} fontFamily="monospace">A/F ↑</text>
                              <text x={780} y={313} textAnchor="end" fill={FG_DIM} fontSize={10} fontFamily="monospace">Throttle →</text>
                            </>);
                          })()}
                        </svg>
                      </Panel>
                    )}

                    {activeSession.hasThrottle && lapWOT.length > 0 && (
                      <Panel title="Per-lap WOT (>60% throttle) average A/F — tuning consistency" accent>
                        <svg viewBox="0 0 800 240" className="w-full" style={{ background: BG }}>
                          {(() => {
                            const sx = (i) => 50 + (i / Math.max(1, lapWOT.length - 1)) * 730;
                            const sy = (a) => 200 - ((a - AFR_MIN) / (AFR_MAX - AFR_MIN)) * 180;
                            return (<>
                              <rect x={50} y={sy(target.high)} width={730} height={sy(target.low) - sy(target.high)}
                                fill={ACCENT} opacity={0.1} />
                              {[10, 12, 13, 14, 16].map((v, i) => (
                                <g key={i}>
                                  <line x1={50} y1={sy(v)} x2={780} y2={sy(v)} stroke={STROKE} strokeWidth={0.3} />
                                  <text x={45} y={sy(v) + 3} textAnchor="end" fill={FG_DIM} fontSize={9} fontFamily="monospace">{v}</text>
                                </g>
                              ))}
                              <path d={lapWOT.map((d, i) => `${i ? "L" : "M"}${sx(i)},${sy(d.avg)}`).join("")}
                                fill="none" stroke={ACCENT} strokeWidth={1} opacity={0.5} />
                              {lapWOT.map((d, i) => (
                                <g key={i}>
                                  <circle cx={sx(i)} cy={sy(d.avg)} r={4} fill={afrColor(d.avg, activeSession.engineType)} stroke={FG} strokeWidth={0.5} />
                                  <text x={sx(i)} y={220} textAnchor="middle" fill={FG_DIM} fontSize={9} fontFamily="monospace">L{d.lap}</text>
                                  <text x={sx(i)} y={sy(d.avg) - 8} textAnchor="middle" fill={FG} fontSize={9} fontFamily="monospace">{d.avg.toFixed(2)}</text>
                                </g>
                              ))}
                              <text x={50} y={15} fill={FG_DIM} fontSize={10} fontFamily="monospace">avg A/F at WOT ↑</text>
                            </>);
                          })()}
                        </svg>
                      </Panel>
                    )}
                  </>);
                })()}
              </div>
            </>
          )}
        </div>
      </div>

      {/* About modal */}
      {aboutOpen && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-70 p-4" onClick={() => setAboutOpen(false)}>
          <div onClick={(e) => e.stopPropagation()} className="border border-[#252d3a] flex flex-col"
            style={{ background: PANEL, borderRadius: 2, maxWidth: 520, width: "100%", maxHeight: "85vh" }}>
            <div className="px-4 py-3 border-b border-[#252d3a] flex items-center justify-between flex-shrink-0">
              <div className="flex items-center gap-2">
                <div className="w-1 h-5" style={{ background: ACCENT }}></div>
                <div>
                  <div className="font-mono text-sm tracking-[0.2em] uppercase">Drogger // Telemetry</div>
                  <div className="font-mono text-[9px] tracking-wider text-gray-500 uppercase">Endurance Analyzer · v{APP_VERSION}</div>
                </div>
              </div>
              <button onClick={() => setAboutOpen(false)} className="p-2 -mr-2 text-gray-400 active:text-yellow-400 hover:text-yellow-400">
                <X size={18} />
              </button>
            </div>
            <div className="overflow-y-auto p-4 space-y-4">
              <section>
                <div className="text-[10px] uppercase tracking-[0.18em] font-mono text-gray-500 mb-1">About</div>
                <p className="font-mono text-xs text-gray-300 leading-relaxed">
                  Drogger（BizStation）GPSロガーのCSVデータを可視化・分析するツールです。
                  ミニバイク・カート耐久レースでの活用を想定して作られました。
                  ラップ解析、ライン比較、A/F燃調モニタリング、ライダー別集計などができます。
                </p>
              </section>

              <section>
                <div className="text-[10px] uppercase tracking-[0.18em] font-mono text-gray-500 mb-1">プライバシー</div>
                <p className="font-mono text-xs text-gray-300 leading-relaxed">
                  読み込んだCSVデータはお使いのブラウザ内でのみ処理され、外部のサーバーには送信されません。
                  ライダー名・スティント割当てなどもブラウザ内に留まり、ページを閉じると消えます。
                </p>
                <p className="font-mono text-xs text-gray-300 leading-relaxed mt-2">
                  匿名のページビュー集計（Vercel Analytics）のみ利用しています。個人を特定できる情報は収集していません。
                </p>
              </section>

              <section>
                <div className="text-[10px] uppercase tracking-[0.18em] font-mono text-gray-500 mb-2">変更履歴</div>
                <div className="space-y-3">
                  {CHANGELOG.map((entry) => (
                    <div key={entry.version} className="border-l-2 pl-3" style={{ borderColor: entry.version === APP_VERSION ? ACCENT : STROKE }}>
                      <div className="font-mono text-xs flex items-baseline gap-2">
                        <span className={entry.version === APP_VERSION ? "text-yellow-400" : "text-gray-200"}>v{entry.version}</span>
                        <span className="text-gray-500 text-[10px]">{entry.date}</span>
                      </div>
                      <ul className="font-mono text-[11px] text-gray-400 mt-1 space-y-0.5">
                        {entry.notes.map((n, i) => (
                          <li key={i} className="flex gap-1.5"><span className="text-gray-600">·</span><span>{n}</span></li>
                        ))}
                      </ul>
                    </div>
                  ))}
                </div>
              </section>

              <section>
                <div className="text-[10px] uppercase tracking-[0.18em] font-mono text-gray-500 mb-1">ソース</div>
                <a href="https://github.com/countZeroNine/drogger_analyzer" target="_blank" rel="noopener noreferrer"
                  className="font-mono text-xs text-cyan-400 hover:text-yellow-400 inline-flex items-center gap-1.5">
                  <Github size={11} /> github.com/countZeroNine/drogger_analyzer
                </a>
              </section>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// Hide loader and mount the app
document.getElementById('loader').style.display = 'none';
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<DroggerAnalyzer />);
  </script>
</body>
</html>
